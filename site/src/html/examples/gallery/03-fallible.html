<p class="tagline">No null and no exceptions. A failure is a value with a type.</p>

<p><code>T?</code> is a <code>T</code> or an error. <code>fail</code> makes one, <code>?</code> hands it to the caller, and <code>match</code> looks at both halves. Nothing can be null, so there is nothing to forget to check.</p>
