<p class="tagline">Return failures as values and handle them explicitly.</p>

<p>A function returning <code>T?</code> gives either a <code>T</code> value or an error. <code>fail</code> creates the error, <code>?</code> returns it to the caller, and <code>match</code> handles success and failure. Heroes has no exceptions: the return type says whether a call can fail.</p>
