<p class="tagline">Change a copy without changing the original value.</p>

<p>After <code>b: [i64] @ a</code>, changing <code>b</code> cannot change <code>a</code>. A function marks an argument it can change with <code>@</code>, both in its declaration and at every call. You can see at the call whether the function may change the value you pass.</p>
