<p class="tagline">Quante iterazioni servono a una fascia dell&rsquo;insieme di Mandelbrot, contate da più thread.</p>

<p>Il membro a due dimensioni di questa famiglia: ogni thread prende una fascia di righe e le fasce non costano uguale, perché un punto dentro l&rsquo;insieme arriva al limite di iterazioni e uno fuori scappa presto.</p>
