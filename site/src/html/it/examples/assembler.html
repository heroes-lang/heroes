<p class="tagline">Una macchina a registri, assemblata e poi eseguita.</p>

<p>Due passaggi, perché un salto può nominare un&rsquo;etichetta più in basso. La codifica e il decodificatore nascono dallo stesso insieme di costanti, quindi non possono contraddirsi, e l&rsquo;esecuzione è limitata da un carburante invece che dalla fiducia.</p>
