<p class="tagline">Una funzione, molti tipi, e nessun tipo scritto al punto di chiamata.</p>

<p>I generici stanno sulle funzioni, non prendono vincoli, e vengono dedotti oppure rifiutati. Una funzione di primo livello è anche un valore, e il suo tipo si scrive con la stessa parola che la dichiara.</p>
