<p class="tagline">Una ricerca ti dà un valore oppure un errore, mai una sorpresa.</p>

<p><code>m[k]</code> non restituisce un <code>V</code>. Restituisce un <code>V?</code>, perché la chiave potrebbe non esserci, quindi il compilatore ti fa dire cosa succede quando manca. Non c&rsquo;è nessun null da dimenticare.</p>
