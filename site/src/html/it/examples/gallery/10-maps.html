<p class="tagline">La ricerca in una mappa restituisce un valore oppure un errore se la chiave manca.</p>

<p>Una mappa associa chiavi a valori. <code>m[k]</code> cerca la chiave k e restituisce un <code>V?</code>: un valore di tipo <code>V</code> oppure un errore. Quando leggi il risultato, devi quindi gestire anche il caso in cui la chiave non esiste.</p>
