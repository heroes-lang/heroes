<p class="tagline">Un valore che può prendere più forme, e l&rsquo;unico costrutto che lo smonta.</p>

<p><code>match</code> copre tutte le forme o il programma non compila, e il caso generico qui è vietato. Se aggiungi una forma, si rompe ogni punto che deve saperlo: è proprio il motivo per scriverlo così.</p>
