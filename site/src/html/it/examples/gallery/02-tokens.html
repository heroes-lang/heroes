<p class="tagline">Un valore che può assumere forme diverse e un match per gestirle tutte.</p>

<p><code>match</code> deve gestire ogni forma possibile, altrimenti il programma non compila. Per questo tipo di valore non puoi usare un ramo generico che accetti tutto. Se aggiungi una forma, il compilatore segnala ogni match da aggiornare.</p>
