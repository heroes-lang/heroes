<p class="tagline">Il programma più piccolo che valga la pena compilare, e il primo che questo compilatore ha eseguito.</p>

<p>Stampa un numero. Quello che vale la pena notare è cosa manca: nessuna riga di import, nessun file di progetto, nessuna classe intorno. Un file con un <code>main</code> dentro è un programma.</p>
