<p class="tagline">Ogni valore è una copia indipendente. Niente punta a niente.</p>

<p>Dopo <code>b = a</code>, cambiare <code>b</code> non può cambiare <code>a</code>. Una funzione che deve modificare il suo argomento lo dichiara con <code>@</code>, nella firma e a ogni chiamata, così una chiamata che modifica non può somigliare a una che legge.</p>
