<p class="tagline">Due cicli, due parole, e ogni modifica a un valore segnata dove avviene.</p>

<p><code>while</code> gira finché una condizione vale e <code>for</code> scorre una sequenza. Modificare un valore riguarda la minoranza delle righe e porta un segno, quindi la parte del programma che dipende dall&rsquo;ordine è quella che salta agli occhi.</p>
