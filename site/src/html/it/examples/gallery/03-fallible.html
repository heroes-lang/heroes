<p class="tagline">Niente null e niente eccezioni. Un errore è un valore con un tipo.</p>

<p><code>T?</code> è un <code>T</code> oppure un errore. <code>fail</code> lo crea, <code>?</code> lo passa al chiamante, e <code>match</code> guarda le due metà. Niente può essere null, quindi non c&rsquo;è nulla da dimenticare di controllare.</p>
