<p class="tagline">Gli errori sono valori con un tipo: Heroes non usa null o eccezioni.</p>

<p><code>T?</code> contiene un valore di tipo <code>T</code> oppure un errore. <code>fail</code> crea l&rsquo;errore, <code>?</code> lo restituisce alla funzione chiamante e <code>match</code> distingue i due casi. Il tipo rende esplicita la possibilità di un errore.</p>
