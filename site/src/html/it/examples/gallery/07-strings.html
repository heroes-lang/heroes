<p class="tagline">Byte e caratteri sono due lavori diversi, e il linguaggio non li confonde.</p>

<p>Una <code>str</code> è UTF-8 immutabile, misurata in byte. <code>s[i]</code> dà un numero e <code>s.chars()</code> scorre i caratteri. Prendere quello sbagliato è uno sbaglio che fai alla luce del sole invece di spedirlo.</p>
