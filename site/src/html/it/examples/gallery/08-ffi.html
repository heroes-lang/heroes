<p class="tagline">Non esiste una libreria standard. Tutto il resto arriva dal C.</p>

<p>Matematica oltre l'aritmetica, file, socket, database: arrivano con <code>extern</code>, e clang verifica ogni dichiarazione contro l'header vero. Un tipo sbagliato qui è un errore di compilazione, non un crash più tardi.</p>
