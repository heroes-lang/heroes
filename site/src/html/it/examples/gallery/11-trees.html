<p class="tagline">Un albero che contiene se stesso, in un linguaggio senza puntatori.</p>

<p>L&rsquo;array è l&rsquo;unica indirezione che esiste. <code>[Expr]</code> contiene valori <code>Expr</code>, quindi un nodo può tenere i suoi figli e l&rsquo;albero resta un valore che si copia come si copia un numero.</p>
