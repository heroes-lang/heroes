<p class="tagline">Un albero di espressioni, con i nodi figli conservati in array.</p>

<p>Un array è una sequenza di valori: qui <code>[Expr]</code> contiene valori <code>Expr</code>. Ogni nodo può così contenere altri nodi dello stesso tipo. L&rsquo;intero albero resta un valore indipendente, che si copia come un numero.</p>
