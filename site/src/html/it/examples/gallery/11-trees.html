<p class="tagline">Un albero che contiene se stesso, in un linguaggio senza puntatori.</p>

<p>L'array è l'unica indirezione che esiste. <code>[Expr]</code> contiene valori <code>Expr</code>, quindi un nodo può tenere i suoi figli e l'albero resta un valore che si copia come si copia un numero.</p>
