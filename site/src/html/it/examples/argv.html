<p class="tagline">Un programma che legge gli argomenti della riga di comando in due modi.</p>

<p>Confronta la funzione che restituisce gli argomenti come testo con quella che segnala anche gli argomenti non validi in UTF-8, il formato usato da Heroes per le stringhe. Mostra quali dati riceve un programma quando lo avvii.</p>
