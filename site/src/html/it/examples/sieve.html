<p class="tagline">I numeri primi per esclusione, verificati contro conteggi pubblicati da altri.</p>

<p>25 sotto 100, 168 sotto 1000, 1229 sotto diecimila. Un secondo algoritmo che non condivide una riga con il primo calcola le stesse risposte, e questo prende uno sbaglio e non soltanto un cambiamento.</p>
