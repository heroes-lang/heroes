<p class="tagline">Testo con dei buchi, riempiti da una mappa, e tre modi di riempirne uno.</p>

<p>Una chiave che manca viene rifiutata, un valore di ripiego si chiede in modo esplicito, e le graffe si possono proteggere in entrambi i versi. Un test ha trovato la regola di protezione asimmetrica prima di qualunque lettore.</p>
