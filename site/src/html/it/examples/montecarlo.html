<p class="tagline">Stimare pi greco contando freccette, un thread per seme.</p>

<p>La lezione è cosa viene dato a un thread: un seme e non un flusso di numeri. Due thread che condividono un generatore sarebbero la classica corsa critica, e qui non si può scrivere, perché quello che entra in un thread è un numero.</p>
