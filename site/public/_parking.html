<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroes</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0b10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 32'%3E%3Cpath fill='%23ef4a52' d='M 14 0 L2 18 h8 L7 32 L22 12 h-9 z'/%3E%3C/svg%3E">
<!--
  The page every URL answers with until the site opens.

  Self-contained on purpose, and this is not a style preference. `_routes.json`
  excludes this file alone from the catch-all Function, so a request for
  `/style.css` reaches the Function like any other and comes back as this page.
  A stylesheet link here would render unstyled; an image would not load. Every
  byte a visitor needs has to be inside this file.

  The palette is the site's own tokens, dark first with the light inversion
  under it, so the holding page and the site it hides look like one hand.
-->
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0b10;
    --fg: #efece4;
    --dim: #9d998f;
    --red: #ef4a52;
    --blue: #3f7bff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f2e9; --fg: #17150f; --dim: #6a6559; --red: #c2262b; --blue: #1f4fd8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 1.0625rem/1.72 Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 2rem;
  }
  svg { width: 3rem; height: 4rem; display: block; margin: 0 auto 1.6rem; }
  h1 {
    font-family: 'Avenir Next Condensed', 'HelveticaNeue-CondensedBold',
                 'Helvetica Neue', 'Roboto Condensed', 'Arial Narrow', sans-serif;
    font-size: clamp(2.4rem, 9vw, 4rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 0.8rem;
  }
  p { color: var(--dim); margin: 0.4rem 0; }
</style>
</head>
<body>
<main>
  <!-- the Aladdin Sane bolt (1973): red over blue, worn at a jaunty angle -->
  <svg viewBox="0 0 48 64" aria-hidden="true">
    <path fill="var(--blue)" d="M 30 2 L8 36 h14 L16 62 L44 24 h-16 z" transform="translate(3.5,3)"/>
    <path fill="var(--red)"  d="M 30 2 L8 36 h14 L16 62 L44 24 h-16 z"/>
  </svg>
  <h1>Heroes</h1>
  <p>heroes-lang.org</p>
  <p>Work in progress.</p>
</main>
</body>
</html>
