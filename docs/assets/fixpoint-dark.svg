<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="The fixpoint: seed/heroes.c is compiled by clang into the heroes binary, which compiles selfhost/ back into a C file identical to seed/heroes.c">
  <!-- The fixpoint, drawn as the loop it is: C makes the compiler, the compiler
       makes the C, and the two C files are the same bytes. Same art direction as
       the banner (site/README.md § The visual system): paper and ink, with red
       spent once, on the closing arc, because that arc is the claim.

       Twin of fixpoint-light.svg: the two files differ ONLY in the palette
       block below, so a change to the layout is made twice or not at all.

       The three numbers were measured on 2026-08-31 (CLAUDE.md §1): the seed
       build and the emission were timed with `/usr/bin/time -p`, and `cmp` of
       the emitted C against seed/heroes.c reported no difference at 23,229,142
       bytes, which is 22 MB. The box says 22 MB rather than the byte
       count because the seed is regenerated by nearly every compiler change,
       and a graphic nobody re-measures should not carry the digit that moves. -->
  <style>
    .plate { fill: #0b0b10; stroke: #262633; stroke-width: 1.5; }
    .box   { fill: #14141d; stroke: #262633; stroke-width: 1; }
    .fg    { fill: #efece4; }
    .dim   { fill: #9d998f; }
    .blue  { fill: #3f7bff; }
    .red   { fill: #ef4a52; }
    .code  { fill: #d6dcf2; }
    .arrow { stroke: #4a4a5c; stroke-width: 1.5; fill: none; }
    .head  { fill: #4a4a5c; }
    .loop  { stroke: #ef4a52; stroke-width: 1.5; fill: none; }
    .loophead { fill: #ef4a52; }
    .mono  { font-family: ui-monospace,'SF Mono',Menlo,monospace; }
    .name  { font-size: 17px; }
    .sub   { font-size: 12px; }
    .step  { font-size: 11px; }
    .kick  { font-size: 12.5px; letter-spacing: 3px; }
    .claim { font-size: 13.5px; }
  </style>

  <rect class="plate" x="0.75" y="0.75" width="1198.5" height="318.5" rx="16"/>

  <text class="mono kick blue" x="64" y="48">THE FIXPOINT</text>

  <!-- 1: the seed. A checkout with no Heroes compiler starts here. -->
  <rect class="box" x="64" y="84" width="240" height="104" rx="8"/>
  <text class="mono name code" x="184" y="126" text-anchor="middle">seed/heroes.c</text>
  <text class="mono sub dim" x="184" y="152" text-anchor="middle">22 MB of C11</text>

  <path class="arrow" d="M 312 152 H 464"/>
  <polygon class="head" points="472,152 460,146 460,158"/>
  <text class="mono step dim" x="392" y="126" text-anchor="middle">clang -I runtime</text>
  <text class="mono step dim" x="392" y="142" text-anchor="middle">3.7 s</text>

  <!-- 2: the compiler. Its stages are printed inside it because every one of
       them is reachable from the command line as its own dump flag. -->
  <rect class="box" x="480" y="84" width="240" height="104" rx="8"/>
  <text class="mono name fg" x="600" y="126" text-anchor="middle">heroes</text>
  <text class="mono sub dim" x="600" y="152" text-anchor="middle">lex &#183; parse &#183; check &#183; IR &#183; C11</text>

  <path class="arrow" d="M 728 152 H 880"/>
  <polygon class="head" points="888,152 876,146 876,158"/>
  <text class="mono step dim" x="808" y="126" text-anchor="middle">build selfhost/</text>
  <text class="mono step dim" x="808" y="142" text-anchor="middle">167 files, 37.8 s</text>

  <!-- 3: what it emits for its own source. -->
  <rect class="box" x="896" y="84" width="240" height="104" rx="8"/>
  <text class="mono name code" x="1016" y="126" text-anchor="middle">the C it emits</text>
  <text class="mono sub dim" x="1016" y="152" text-anchor="middle">for selfhost/main.hero</text>

  <!-- the loop closes: the emitted C is the seed, to the byte -->
  <path class="loop" d="M 1016 188 V 250 Q 1016 270 996 270 H 204 Q 184 270 184 250 V 200"/>
  <polygon class="loophead" points="184,188 177,202 191,202"/>
  <text class="mono claim red" x="600" y="262" text-anchor="middle">identical to seed/heroes.c, byte for byte</text>
</svg>
