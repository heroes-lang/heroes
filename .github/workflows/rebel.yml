# Rebel's own pipeline: Rebel compiled and tested on the four machines of
# `.github/workflows/ci.yml`, and nothing else (the author's decision 7 of
# 2026-11-15, on the page `docs/roadmap/milestones/M-rebel-library.md`: *Rebel
# has a CI pipeline of its own, which compiles and tests Rebel and nothing
# else, and starts only when a push touches Rebel*).
#
# What it runs, each on Linux x86-64, Linux arm64, Darwin arm64 and Windows
# x86-64, with the compiler built as `ci.yml` builds it (stage 1 from the seed
# by `seed/README.md`'s line, then stage 2, this commit's source, which judges):
#
#   - **the `rebel` suite of the net** (`tests/harness/suite_rebel.hero`), the
#     coherence review's instruments over `packages/rebel` and its rules page,
#     its `docs` check among them: `heroes doc` over every face and every
#     floor of Rebel, each reference read for `examples-rebel/README.md` § A7's
#     rules, and red where the verb refuses one (`tests/harness/rebel_docs.hero`).
#     A step of this file's own ran `heroes doc` over every face from step 65a
#     to step 94a, which removed it as the check's repetition;
#   - **every package's own tests**, through the drivers
#     `examples-rebel/reach_*.hero` (the `plan` job counts them), each
#     `heroes test` plain, and on the two Linux legs also under
#     `--sanitize`, since LeakSanitizer is there and a driver reaches the
#     floors' C bindings (`.claude/rules/platforms.md` § Linux is where a leak
#     in a binding is visible);
#   - **Rebel's programs**, in a part of their own, `programs`, beside the
#     drivers' parts and with their installs: every
#     application of `examples-rebel/` built and its demo held to its
#     `main.expected`, every twin held to its original's, and the
#     applications' catalogues asked for every face of Rebel, by the check of
#     Rebel's programs (`tests/harness/rebel_apps.hero`, README § A10), a
#     small jq among them (`examples-rebel/jq/`).
#
# Every system library a Rebel package links or loads is installed below, on
# the platform that lacks it (the author's decision 6 of 2026-11-19: nothing is
# installed on the Windows box, so the CI installs it), each asked for by the
# name the code asks and then asked to answer, so a leg meant to run a test
# never skips it quietly. Read from the tree, never from a list: the `link`
# lines of `packages/rebel/` (`git grep -n '^link\|link "' packages/rebel/`
# names two, `m` and `sqlite3`), the `#pragma comment(lib)` and `.linker_option`
# lines of `runtime/platform/` (Windows SDK libraries and macOS frameworks,
# which every image carries), and its `dlopen` calls (OpenSSL's `libssl` and
# `libcrypto`, `libsecret-1`, unixODBC's `libodbc`).
#
# No server runs here (MongoDB, AMQP, Kafka, LDAP, MQTT, NATS, Redis, S3,
# MySQL, PostgreSQL, an ACME directory, a model's API): no secret and no
# address is given, and a paid run is never one. A test that needs one is
# owed `skip_test` with its reason (spec § 12), which the drivers' step
# prints. Panel 253 counted 106 tests that print a skip line or nothing and
# read `ok` instead (2026-11-19), and step 61b converted five of them; the
# rest are owed the same. No driver's every test needs a server, so none is
# an all-skipped run.
#
# **Its first run is the landing push's**: a workflow cannot run before it is
# pushed, and no line below has run on a runner. The install steps were written
# from the packages' and the images' documentation and the Windows box's
# measurements, and say so where they rest on one.

name: rebel

on:
  # A push to `main` touching Rebel's packages, its examples, the platform
  # layer its floors bind, or this file. A compiler change alone does not
  # start it, which is decision 7's trade: what such a change breaks in Rebel
  # is seen at the next push that touches Rebel, at the next release tag, or
  # by a dispatch. The `rebel` suite's own instruments live in `tests/harness/`
  # and are part of the net, so `ci.yml` runs them on every push.
  push:
    branches: [main]
    # GitHub evaluates no path filter on a tag's push (its workflow syntax
    # reference, read 2026-11-20), so every release tag runs this whole.
    tags: ['v*']
    paths:
      - 'packages/rebel/**'
      - 'examples-rebel/**'
      - 'generators/**'
      - 'runtime/platform/**'
      - '.github/workflows/rebel.yml'
  # A pull request touching the same paths, so a change to Rebel is judged
  # before it reaches `main`. A fork's run gets a read-only token and no secret.
  pull_request:
    paths:
      - 'packages/rebel/**'
      - 'examples-rebel/**'
      - 'generators/**'
      - 'runtime/platform/**'
      - '.github/workflows/rebel.yml'
  # By hand, the door for a compiler change suspected of breaking Rebel.
  workflow_dispatch:

# One run per ref: a second push cancels the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The parts the drivers are dealt into on each leg (job `plan`).
  PARTS: 8
  # A driver's run that has not ended after this many seconds is stopped and
  # read as red, so one hung test costs one driver rather than its part.
  LIMIT: 3600
  # The most bytes of one run's output kept; a run that writes more is cut
  # there and read as red, so a program writing without end fills no disk.
  BYTES: 20000000

jobs:
  # ───────────────────── The suite and the documentation ─────────────────────
  coherence:
    name: ${{ matrix.leg.name }}, Rebel's suite and documentation
    runs-on: ${{ matrix.leg.os }}
    timeout-minutes: 120
    strategy:
      # No platform's failure hides another's.
      fail-fast: false
      matrix:
        leg:
          - { name: 'Linux x86-64', os: ubuntu-26.04, exe: '' }
          - { name: 'Linux arm64', os: ubuntu-26.04-arm, exe: '' }
          - { name: 'Darwin arm64', os: macos-26, exe: '' }
          - { name: 'Windows x86-64', os: windows-latest, exe: '.exe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # clang is the backend (CLAUDE.md § 7), named rather than found by chance
      # on the image, as `ci.yml` names it.
      - name: Install clang
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # `seed/README.md`'s line, with the stack flag it prints for Windows.
      - name: Build the compiler from the seed
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then STACK="-Wl,/STACK:67108864"; else STACK=""; fi
          clang --version
          clang -I runtime seed/heroes.c runtime/runtime.c $STACK -o heroes-from-seed${{ matrix.leg.exe }}
          ./heroes-from-seed${{ matrix.leg.exe }} --version

      - name: Stage 2, the compiler this commit's source builds
        id: stage2
        shell: bash
        run: |
          ./heroes-from-seed${{ matrix.leg.exe }} build selfhost/main.hero -o heroes${{ matrix.leg.exe }}
          ./heroes${{ matrix.leg.exe }} --version

      # The harness built by stage 1 and judging stage 2, as `ci.yml`'s net is
      # (panel 231's R2). The suite reads files, and runs the compiler it
      # judges for one thing, its `docs` check (`tests/harness/rebel_docs.hero`,
      # since step 86g): `heroes doc <rebel>/<module>` over every face and
      # every floor of Rebel's newest version, through a catalogue of its own
      # whose one `path` entry places that version whole, each reference read
      # for README § A7's rules. A module the verb refuses is a finding, and no
      # `docs` finding is kept in `tests/harness/rebel_kept.hero`, so a refusal
      # turns this step red, as do fewer modules documented than the suite's
      # least (`LEAST_REFERENCES`, 175 on 2026-11-21: 152 faces and 23
      # floors). That is every face the step
      # `heroes doc over every face` ran from step 65a, read through
      # `examples-rebel/heroes.toml`'s one `path`, the same version folder, and
      # each face by the same rule (a part `internal` after the first is
      # private, a last part beginning `hero_` a floor), with the floors added:
      # step 94a removed that step as the check's repetition.
      - name: The rebel suite
        shell: bash
        run: ./heroes-from-seed${{ matrix.leg.exe }} run tests/harness/main.hero -- ./heroes${{ matrix.leg.exe }} rebel

  # ─────────────── Every generated table still its generator's ───────────────
  #
  # Each program under `generators/` writes one or more of Rebel's generated
  # tables from pinned public data and has a `check` that reads the tables in
  # the tree and exits 0 where each is byte for byte what the generator
  # writes, 1 where one is not (naming the first line that differs), and 2
  # where its input is not the one it is pinned to. An input whose licence
  # lets it be copied and whose source serves only its latest version is kept
  # in the generator's own folder; any other is fetched here by the URL the
  # generator records and held to the SHA-256 it pins, so no generator can rot
  # unseen. One leg: the tables are text, the same on every platform.
  generators:
    name: Linux x86-64, every generated table checked against its generator
    runs-on: ubuntu-26.04
    # Each step builds a generator with the Rebel packages it reads, one to
    # four minutes apiece on a Mac running other builds on 2026-11-22; how
    # long the job takes on a runner is unrun, so the limit leaves room.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build the compiler from the seed, then stage 2
        run: |
          clang -I runtime seed/heroes.c runtime/runtime.c -o heroes-from-seed
          ./heroes-from-seed build selfhost/main.hero -o heroes
          ./heroes --version

      # `generators/i18n_units/cldr.hero`'s `SOURCE_URL`; the generator holds
      # the zip to its `SOURCE_SHA256` itself.
      - name: generators/i18n_units, CLDR 49's unit table of i18n/dates
        run: |
          mkdir -p build/generators
          curl --fail --location --silent --show-error -o build/generators/cldr-49.0.0-json-full.zip \
            https://github.com/unicode-org/cldr-json/releases/download/49.0.0/cldr-49.0.0-json-full.zip
          ./heroes run generators/i18n_units/main.hero -- check build/generators/cldr-49.0.0-json-full.zip

      # The WHATWG's files are kept in `generators/unicode_encodings/whatwg/`.
      - name: generators/unicode_encodings, the WHATWG Encoding Standard's tables of unicode/encodings
        run: ./heroes run generators/unicode_encodings/main.hero -- check

      # `generators/brotli/main.hero`'s `SOURCE_URL`; the generator holds the
      # text to its `SOURCE_SHA256` itself.
      - name: generators/brotli, RFC 7932's dictionary, transforms and context tables of compress/brotli
        run: |
          mkdir -p build/generators
          curl --fail --location --silent --show-error -o build/generators/rfc7932.txt \
            https://www.rfc-editor.org/rfc/rfc7932.txt
          ./heroes run generators/brotli/main.hero -- check build/generators/rfc7932.txt

      # The HTML Standard's `entities.json` is kept in
      # `generators/html_entities/whatwg/`.
      - name: generators/html_entities, the HTML Standard's named character references of html
        run: ./heroes run generators/html_entities/main.hero -- check

      # The five files of `generators/unicode_cases/main.hero`'s
      # `AUXILIARY_URL` and `UCD_URL`; the generator holds each to its SHA-256.
      - name: generators/unicode_cases, Unicode 17.0.0's conformance cases of unicode/segment and unicode/normalize
        run: |
          mkdir -p build/generators/ucd-17.0.0
          for f in GraphemeBreakTest WordBreakTest SentenceBreakTest LineBreakTest; do
            curl --fail --location --silent --show-error -o "build/generators/ucd-17.0.0/$f.txt" \
              "https://www.unicode.org/Public/17.0.0/ucd/auxiliary/$f.txt"
          done
          curl --fail --location --silent --show-error -o build/generators/ucd-17.0.0/NormalizationTest.txt \
            https://www.unicode.org/Public/17.0.0/ucd/NormalizationTest.txt
          ./heroes run generators/unicode_cases/main.hero -- check build/generators/ucd-17.0.0

      # The four files of `generators/tokenizer_tables/main.hero`'s
      # `RANKS_URL` and `TIKTOKEN_URL`; the generator holds each to its SHA-256.
      - name: generators/tokenizer_tables, tiktoken's tables of tokenizer/tables
        run: |
          mkdir -p build/generators/tiktoken
          for f in cl100k_base o200k_base; do
            curl --fail --location --silent --show-error -o "build/generators/tiktoken/$f.tiktoken" \
              "https://openaipublic.blob.core.windows.net/encodings/$f.tiktoken"
          done
          curl --fail --location --silent --show-error -o build/generators/tiktoken/openai_public.py \
            https://raw.githubusercontent.com/openai/tiktoken/0.14.0/tiktoken_ext/openai_public.py
          curl --fail --location --silent --show-error -o build/generators/tiktoken/model.py \
            https://raw.githubusercontent.com/openai/tiktoken/0.14.0/tiktoken/model.py
          ./heroes run generators/tokenizer_tables/main.hero -- check build/generators/tiktoken

      # The list and its tests are kept in `generators/http_suffixes/publicsuffix/`.
      - name: generators/http_suffixes, the Public Suffix List of http/suffixes
        run: ./heroes run generators/http_suffixes/main.hero -- check

      # The five files of `generators/url_idna/main.hero`'s `IDNA_URL` and
      # `EXTRACTED_URL`; the generator holds each to its SHA-256.
      - name: generators/url_idna, UTS 46's mapping table, properties and conformance cases of url/idna
        run: |
          mkdir -p build/generators/idna-17.0.0
          for f in IdnaMappingTable IdnaTestV2; do
            curl --fail --location --silent --show-error -o "build/generators/idna-17.0.0/$f.txt" \
              "https://www.unicode.org/Public/17.0.0/idna/$f.txt"
          done
          for f in DerivedBidiClass DerivedJoiningType DerivedCombiningClass; do
            curl --fail --location --silent --show-error -o "build/generators/idna-17.0.0/$f.txt" \
              "https://www.unicode.org/Public/17.0.0/ucd/extracted/$f.txt"
          done
          ./heroes run generators/url_idna/main.hero -- check build/generators/idna-17.0.0

      # The zip `generators/i18n_units` fetched above; `generators/cldrkit`
      # holds it to its SHA-256.
      - name: generators/i18n_core, CLDR 49's plural, locale and alias tables of i18n
        run: ./heroes run generators/i18n_core/main.hero -- check build/generators/cldr-49.0.0-json-full.zip

      # The tests of the packages the generators share: `generators/tablekit/`,
      # which every generator writes its tables with, `generators/cldrkit/`,
      # which reads CLDR's zip, and `generators/ucdkit/`, which reads the
      # Unicode Character Database's files. A generator's own tests are left
      # to whoever changes it: `heroes test` runs every test its program
      # reaches, Rebel's packages' among them (1,875 tests and three minutes
      # for `tablekit` alone on 2026-11-22, on a Mac running other builds),
      # which the `coherence` job runs already, and each `check` above judges
      # a generator's whole output byte for byte.
      - name: generators/tablekit, cldrkit and ucdkit, their tests
        run: |
          ./heroes test generators/tablekit/tablekit.hero
          ./heroes test generators/cldrkit/cldrkit.hero
          ./heroes test generators/ucdkit/ucdkit.hero

  # ──────────────── The drivers, dealt into parts, on every leg ────────────────
  #
  # Whether one job running every driver ends inside GitHub's six hours on
  # Windows is unrun. The box's sweep at step 53 ran its 160 in two lanes side
  # by side from 13:32 to 18:23 on 2026-11-19 (the coordinator's record of it),
  # about five hours of wall for two; one lane alone reading near that or more
  # is an inference, and too close to the ceiling to rest a leg on. So each leg
  # runs them in `PARTS` parts, each its own job building its own compiler, as
  # `ci.yml`'s Windows and Darwin nets do. The drivers are dealt round by their
  # sorted index, the `run` suite's way with its shards, since no runner has
  # timed them yet; every run's seconds go to the job's summary, so a later
  # commit can place them by their minutes as `ci.yml`'s tables are placed.
  plan:
    name: Rebel's drivers in parts, and the programs' part
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Every driver in exactly one part
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          drivers=()
          for file in $(ls examples-rebel/reach_*.hero | LC_ALL=C sort); do
            name=$(basename "$file" .hero)
            if ! printf '%s\n' "$name" | grep -Eqx 'reach_[a-z0-9_]+'; then
              echo "::error::$file is named outside \`reach_[a-z0-9_]+\`, which this step writes into JSON and a shell's words"
              exit 1
            fi
            drivers+=("$name")
          done
          if [ "${#drivers[@]}" -eq 0 ]; then
            echo "::error::no examples-rebel/reach_*.hero, so no package's tests would run"
            exit 1
          fi
          json=""
          dealt=""
          for k in $(seq 1 "$PARTS"); do
            words=""
            for i in "${!drivers[@]}"; do
              if [ $(( i % PARTS + 1 )) -eq "$k" ]; then words="$words${words:+ }${drivers[$i]}"; fi
            done
            if [ -z "$words" ]; then continue; fi
            dealt="$dealt${dealt:+ }$words"
            echo "part $k of $PARTS, $(printf '%s\n' $words | wc -l | tr -d ' ') drivers: $words"
            json="$json${json:+,}{\"part\":\"$k of $PARTS\",\"drivers\":\"$words\"}"
          done
          if [ "$(printf '%s\n' $dealt | LC_ALL=C sort)" != "$(printf '%s\n' "${drivers[@]}" | LC_ALL=C sort)" ]; then
            echo "::error::the parts do not hold every driver exactly once"
            exit 1
          fi
          echo "${#drivers[@]} drivers in $PARTS parts"
          # One more part, `programs`, holding no driver: Rebel's programs,
          # judged by the step of that name in this job's installs.
          json="$json,{\"part\":\"programs\",\"drivers\":\"\"}"
          echo "and the part programs, the check of Rebel's programs"
          echo "parts=[$json]" >> "$GITHUB_OUTPUT"

  tests:
    name: ${{ matrix.leg.name }}, Rebel's tests, part ${{ matrix.slice.part }}
    needs: plan
    runs-on: ${{ matrix.leg.os }}
    # GitHub's own ceiling for a hosted runner.
    timeout-minutes: 360
    strategy:
      # No part's failure hides another's.
      fail-fast: false
      matrix:
        # `runs`: the configurations each driver is tested in on that leg.
        leg:
          - { name: 'Linux x86-64', os: ubuntu-26.04, exe: '', runs: 'plain sanitize' }
          - { name: 'Linux arm64', os: ubuntu-26.04-arm, exe: '', runs: 'plain sanitize' }
          - { name: 'Darwin arm64', os: macos-26, exe: '', runs: 'plain' }
          - { name: 'Windows x86-64', os: windows-latest, exe: '.exe', runs: 'plain' }
        slice: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # LINUX: clang; SQLite's header and library (`sql/sqlite`'s `link
      # "sqlite3"`); OpenSSL, which `runtime/platform/hero_tls.c` and
      # `hero_crypto.c` open by `dlopen` as `libssl.so.3` and
      # `libcrypto.so.3`; `libsecret-1.so.0`, opened by
      # `runtime/platform/hero_keyring.c`, with GNOME Keyring and a session
      # bus to serve it (the drivers' step below); unixODBC's `libodbc.so.2`,
      # opened by `runtime/platform/hero_odbc.c`; and SQLite's ODBC driver,
      # `libsqliteodbc`, which registers itself as `SQLite3`, the name
      # `sql/odbc`'s live tests look for
      # (`packages/rebel/0.1.0/files/sql/odbc/internal/fixture.hero`). Each
      # asked for by the name the code asks, after the install.
      - name: Install what Rebel binds and opens, Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsqlite3-dev openssl libsecret-1-0 libsecret-tools gnome-keyring dbus unixodbc libsqliteodbc
          test -f /usr/include/sqlite3.h \
            || { echo '::error::sqlite3.h is not in /usr/include after the install, so sql/sqlite would be refused `ffi_missing_header`'; exit 1; }
          for wanted in 'libssl\.so\.[34]' 'libcrypto\.so\.[34]' 'libsecret-1\.so\.0' 'libodbc\.so\.2'; do
            ldconfig -p | grep -Eq "^[[:space:]]+$wanted " \
              || { echo "::error::the loader knows no $wanted after the install, so the member that opens it would answer \`unsupported\`"; exit 1; }
          done
          odbcinst -q -d | grep -qx '\[SQLite3\]' \
            || { echo '::error::unixODBC knows no driver named SQLite3 after the install, so sql/odbc would skip its SQLite tests'; exit 1; }
          command -v dbus-run-session gnome-keyring-daemon secret-tool > /dev/null \
            || { echo '::error::dbus-run-session, gnome-keyring-daemon or secret-tool is missing, so keyring would answer `unsupported`'; exit 1; }

      # DARWIN: the SDK carries SQLite (`examples/sqlite` binds it on this leg
      # of `ci.yml`), and the frameworks the floors name (Network, Security,
      # CoreFoundation, CoreServices). Homebrew gives unixODBC, whose
      # `libodbc.2.dylib` `hero_odbc.c` opens by `/opt/homebrew/lib`'s path;
      # SQLite's ODBC driver (`sqliteodbc`, 0.99991 with a bottle for macOS 26,
      # read from Homebrew's API 2026-11-20), which its formula registers with
      # no driver manager, so this step registers it as `SQLite3`; and GNU's
      # `timeout`, as `gtimeout`, which bounds each driver (macOS has none of
      # its own; Git bash on Windows carries GNU's as `/usr/bin/timeout`, and
      # `ubuntu-26.04` uutils' there, the drivers' step says what is asked of
      # each).
      # The untap and the auto-update
      # are `ci.yml`'s, for its reasons.
      - name: Install what Rebel opens, Darwin
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew untap aws/tap >/dev/null 2>&1 || true
          command -v gtimeout > /dev/null || brew install coreutils
          brew list --versions unixodbc > /dev/null || brew install unixodbc
          brew list --versions sqliteodbc > /dev/null || brew install sqliteodbc
          test -f /opt/homebrew/lib/libodbc.2.dylib || test -f /usr/local/lib/libodbc.2.dylib \
            || { echo '::error::no libodbc.2.dylib where hero_odbc.c looks for it, so sql/odbc would answer `unsupported`'; exit 1; }
          driver="$(brew --prefix sqliteodbc)/lib/libsqlite3odbc.dylib"
          test -f "$driver" \
            || { echo "::error::$driver is not there after the install"; exit 1; }
          printf '[SQLite3]\nDescription=SQLite3 ODBC Driver\nDriver=%s\n' "$driver" > "$RUNNER_TEMP/sqlite3-odbc.ini"
          odbcinst -i -d -f "$RUNNER_TEMP/sqlite3-odbc.ini"
          odbcinst -q -d | grep -qx '\[SQLite3\]' \
            || { echo '::error::unixODBC knows no driver named SQLite3 after registering it, so sql/odbc would skip its SQLite tests'; exit 1; }
          command -v gtimeout > /dev/null \
            || { echo '::error::gtimeout is missing after the install, and every driver runs under it'; exit 1; }

      # WINDOWS: the SDK's libraries the floors link by `#pragma comment(lib)`
      # come with the image's Visual Studio. SQLite does not: on the Windows
      # box, 2026-11-19, `sql_sqlite`, `sql_build` and `sql_migrate` were
      # refused `ffi_missing_header` for `sqlite3.h`, the box carrying no
      # SQLite either. It comes from the image's vcpkg, as SDL3 does in
      # `ci.yml`, and only its headers, import library and DLL are copied into
      # folders of their own: a folder holding nothing else holds no file
      # that could stand in for a header the runtime reads, which the
      # compiler refuses (panel 237's R2). The import library is handed to
      # every driver by the compiler's own `--library`, and the headers by
      # `CPATH` in the drivers' step, which says why not `--include`. The
      # headers are every one the
      # port lists under `include/` in vcpkg's own list of its files, since
      # the port patches `sqlite3.h` to include `sqlite3-vcpkg-config.h`:
      # with `sqlite3.h` alone clang stopped, that file not found (sqlite3
      # 3.54.1, run 44912132270 of the branch `rebel-ci-probe`, 2026-11-21).
      # The DLL reaches the programs through
      # PATH. SQLite's ODBC driver has no package on this image (vcpkg holds
      # none, and Chocolatey answered 404 for `sqliteodbc`, 2026-11-20), so
      # `sql/odbc`'s SQLite tests skip here with their reason; its other tests
      # run against the system's `odbc32.dll`, as on the box (943 passed,
      # 2026-11-18). A name the port does not install stops this step by
      # name.
      - name: Install SQLite with vcpkg, Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          root="$VCPKG_INSTALLATION_ROOT/installed/x64-windows-release"
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install sqlite3:x64-windows-release --disable-metrics
          dir="$RUNNER_TEMP/sqlite3"
          mkdir -p "$dir/include" "$dir/lib" "$dir/bin"
          set -- "$VCPKG_INSTALLATION_ROOT"/installed/vcpkg/info/sqlite3_*_x64-windows-release.list
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::vcpkg lists no one sqlite3 port for x64-windows-release: $*"
            exit 1
          fi
          headers=$(grep -E '^x64-windows-release/include/[^/]+\.h$' "$1")
          printf '%s\n' "$headers" | grep -qx 'x64-windows-release/include/sqlite3.h' \
            || { echo "::error::the sqlite3 port's list, $1, names no include/sqlite3.h"; exit 1; }
          for header in $headers; do cp "$VCPKG_INSTALLATION_ROOT/installed/$header" "$dir/include/"; done
          ls "$dir/include"
          cp "$root/lib/sqlite3.lib" "$dir/lib/"
          cp "$root/bin/sqlite3.dll" "$dir/bin/"
          cygpath -w "$dir/bin" >> "$GITHUB_PATH"
          echo "SQLITE_INCLUDE=$(cygpath -m "$dir/include")" >> "$GITHUB_ENV"
          echo "SQLITE_LIB=$(cygpath -m "$dir/lib")" >> "$GITHUB_ENV"

      # The question `sql/sqlite`'s group asks, asked of clang alone before
      # any driver: its header found, `-lsqlite3` linked, the library loaded
      # and answering its version.
      - name: SQLite answers clang
        shell: bash
        run: |
          mkdir -p build
          printf '#include <stdio.h>\n#include <sqlite3.h>\nint main(void) { printf("SQLite %%s\\n", sqlite3_libversion()); return sqlite3_libversion_number() > 0 ? 0 : 1; }\n' > build/sqlite-probe.c
          if [ "$RUNNER_OS" = "Windows" ]; then
            clang build/sqlite-probe.c -I"$SQLITE_INCLUDE" -L"$SQLITE_LIB" -lsqlite3 -o build/sqlite-probe.exe
            ./build/sqlite-probe.exe
          else
            clang build/sqlite-probe.c -lsqlite3 -o build/sqlite-probe
            ./build/sqlite-probe
          fi

      - name: Build the compiler from the seed
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then STACK="-Wl,/STACK:67108864"; else STACK=""; fi
          clang --version
          clang -I runtime seed/heroes.c runtime/runtime.c $STACK -o heroes-from-seed${{ matrix.leg.exe }}
          ./heroes-from-seed${{ matrix.leg.exe }} --version

      - name: Stage 2, the compiler this commit's source builds
        shell: bash
        run: |
          ./heroes-from-seed${{ matrix.leg.exe }} build selfhost/main.hero -o heroes${{ matrix.leg.exe }}
          ./heroes${{ matrix.leg.exe }} --version

      # Each driver of the part, in each of the leg's configurations: `heroes
      # test` bounded by `LIMIT` seconds and its output by `BYTES`, its whole
      # output kept under build/rebel-logs/, its count line and its skipped
      # tests printed, and a red one's FAIL lines and last lines with them.
      # After a run stopped for time, the test program it started is stopped
      # too: `heroes` gives it a process group of its own and forwards no
      # signal when it is itself killed (defect 425), so it would go on beside
      # the next driver. Each driver's own build products are removed after
      # its runs and the packages' objects kept, as the box's sweep did. Every
      # run is a row of the job's summary with its seconds. The step ends with
      # the worst exit.
      #
      # On Linux the part runs inside a session bus of its own, where GNOME
      # Keyring, unlocked with a password of this job, serves the Secret
      # Service `hero_keyring.c` reaches through libsecret; a secret stored and
      # read back first, so `keyring`'s tests never answer `unsupported` on a
      # leg meant to run them. Darwin's login keychain and Windows' Credential
      # Manager are the runner's own.
      - name: The part's drivers
        if: ${{ matrix.slice.drivers != '' }}
        shell: bash
        env:
          LEG: ${{ matrix.leg.name }}
          RUNS: ${{ matrix.leg.runs }}
          PART: ${{ matrix.slice.part }}
          DRIVERS: ${{ matrix.slice.drivers }}
          EXE: ${{ matrix.leg.exe }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ -z "${REBEL_SESSION:-}" ]; then
            export REBEL_SESSION=1
            exec dbus-run-session -- bash --noprofile --norc "$0"
          fi
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            printf '%s' "rebel-ci-$GITHUB_RUN_ID" | gnome-keyring-daemon --unlock --components=secrets > /dev/null \
              || { echo '::error::gnome-keyring-daemon did not start in the session'; exit 1; }
            printf '%s' probe | secret-tool store --label='Rebel CI probe' service rebel-ci account probe \
              && [ "$(secret-tool lookup service rebel-ci account probe)" = probe ] \
              && secret-tool clear service rebel-ci account probe \
              || { echo "::error::the Secret Service keeps no secret in this session, so keyring's tests would answer \`unsupported\` on a leg meant to run them"; exit 1; }
            echo "the Secret Service keeps a secret in this session"
          fi
          # `timeout` by its path, since Windows' System32 holds a
          # `timeout.exe` that waits instead: GNU's on Darwin (`gtimeout`) and
          # on Windows (Git's), uutils' on `ubuntu-26.04`, whose
          # `/usr/bin/timeout` links `rust-coreutils` 0.10.0 (read on both
          # Linux runners, 2026-11-21, the branch `rebel-ci-probe`'s run
          # 44913457527). It is asked what every run below reads of it, not
          # whose it is: a command past its time ends 124, and one that
          # ignores TERM is killed by `-k` and ends 137. All four legs
          # answered both in that run.
          case "$RUNNER_OS" in macOS) bound=gtimeout ;; *) bound=/usr/bin/timeout ;; esac
          "$bound" 1 sleep 30; past=$?
          "$bound" -k 1 1 bash -c 'trap "" TERM; sleep 30'; killed=$?
          if [ "$past" -ne 124 ] || [ "$killed" -ne 137 ]; then
            echo "::error::$bound ($("$bound" --version 2> /dev/null | head -n 1)) ended a command past its time with $past and one that ignores TERM with $killed, where every driver's run reads 124 and 137"
            exit 1
          fi
          # SQLite's headers reach clang on Windows through `CPATH`, and its
          # import library through `--library`. Not `--include`: a header a
          # package's group names (`sql/sqlite`'s `extern "sqlite3.h"`),
          # found in a folder `--include` names before the package's own, is
          # refused `shadowed_header` (`selfhost/cli/package_stand_in.hero`,
          # `stood_in`; run 44913457527 of the branch `rebel-ci-probe`,
          # 2026-11-21), and that rule does not count a folder of the
          # environment. The header and the library both come from folders
          # the build is handed, as `ffi_unpaired_release` asks.
          if [ "$RUNNER_OS" = "Windows" ]; then export CPATH="$SQLITE_INCLUDE"; fi
          logs=build/rebel-logs
          mkdir -p "$logs"
          {
            echo "### $LEG, part $PART"
            echo
            echo "| driver | run | exit | seconds | tests |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          worst=0
          red=""
          for name in $DRIVERS; do
            base=$(printf '%s' "$name" | tr -d _)
            for run in $RUNS; do
              set -- "examples-rebel/$name.hero"
              if [ "$RUNNER_OS" = "Windows" ]; then set -- "$@" --library "$SQLITE_LIB"; fi
              if [ "$run" = "sanitize" ]; then set -- "$@" --sanitize; fi
              log="$logs/$name.$run.log"
              echo "::group::$name, $run"
              start=$(date +%s)
              "$bound" -k 30 "$LIMIT" "./heroes$EXE" test "$@" 2>&1 | head -c "$BYTES" > "$log"
              code=${PIPESTATUS[0]}
              took=$(( $(date +%s) - start ))
              said=""
              if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
                said="stopped after $LIMIT s"
                if [ "$RUNNER_OS" = "Windows" ]; then
                  MSYS_NO_PATHCONV=1 taskkill /F /T /FI "IMAGENAME eq $base*" > /dev/null 2>&1
                else
                  pkill -9 -f "build/.*$base" 2> /dev/null
                fi
              elif [ "$(wc -c < "$log" | tr -d ' ')" -ge "$BYTES" ]; then
                said="output cut at $BYTES bytes"
                if [ "$code" -eq 0 ]; then code=1; fi
              fi
              count=$(grep -E '^[0-9]+ tests?[ ,]' "$log" | tail -n 1)
              echo "$name, $run: exit $code, $took s: ${count:-no count line}${said:+ ($said)}"
              grep -E -A1 '^SKIP ' "$log" | head -n 200
              if [ "$code" -ne 0 ]; then
                grep -E '^FAIL' "$log" | head -n 60
                echo "--- the last lines"
                tail -n 60 "$log" | cut -c1-400
                red="$red $name/$run"
                if [ "$code" -gt "$worst" ]; then worst=$code; fi
              fi
              echo "::endgroup::"
              if [ "$code" -ne 0 ]; then echo "::error title=$name, $run::exit $code, ${count:-no count line}${said:+ ($said)}"; fi
              echo "| $name | $run | $code | $took | ${count:-none}${said:+ ($said)} |" >> "$GITHUB_STEP_SUMMARY"
            done
            /usr/bin/find build -maxdepth 2 \( -name "$base" -o -name "$base.*" -o -name "$base-*" \) -exec rm -rf {} + 2> /dev/null
          done
          if [ -n "$red" ]; then echo "::error::the runs of this part that did not end green:$red"; fi
          exit "$worst"

      # The part `programs` (job `plan`): every program of `examples-rebel/`
      # judged by the check of Rebel's programs, `tests/harness/rebel_apps.hero`
      # (`examples-rebel/README.md` § A10): each application built and its demo
      # held to its `main.expected` byte for byte, each twin to its original's
      # in `examples/`, four built or run at once, and the applications'
      # catalogues asked, between them, for every face of Rebel. It is a part
      # of this job, beside the drivers' parts rather than after them, since a
      # job after them all would wait for the slowest and be skipped where any
      # is red; and it takes this job's installs: SQLite for the programs that
      # keep their data in it, its headers by `CPATH` and its import library
      # by `--library` on Windows, as every driver above takes them; and on
      # Linux and Darwin SQLite's ODBC driver registered as `SQLite3`, so
      # `inventory`'s ODBC store runs there and prints its account in the form
      # its `main.varies` declares, where Windows prints the skip. A demo that
      # cannot run on a platform is told `SKIP` by its `main.skips`
      # (`registry` on Windows), never passed.
      #
      # `--partial` while the twenty applications of the milestone's list are
      # still being written: a face no application lists is told on the
      # coverage's line and does not fail the step. It goes when the last of
      # them lands, and a face unlisted then fails the step.
      #
      # The harness is built by stage 1 and judges stage 2, as the `rebel`
      # suite's step does. Every build and every run of the check is bounded by
      # the check itself (an hour a build, five minutes a demo), and its output by
      # `BYTES`; its lines go to the job's summary.
      - name: Rebel's programs
        if: ${{ matrix.slice.part == 'programs' }}
        shell: bash
        env:
          LEG: ${{ matrix.leg.name }}
          EXE: ${{ matrix.leg.exe }}
        run: |
          set +e
          mkdir -p build
          set -- "./heroes$EXE" --partial
          if [ "$RUNNER_OS" = "Windows" ]; then
            export CPATH="$SQLITE_INCLUDE"
            set -- "$@" --library "$SQLITE_LIB"
          fi
          "./heroes-from-seed$EXE" run tests/harness/rebel_apps.hero -- "$@" 2>&1 | head -c "$BYTES" | tee build/rebel-apps.log
          code=${PIPESTATUS[0]}
          {
            echo "### $LEG, Rebel's programs"
            echo
            echo '```'
            grep -E '^(ok   |FAIL |SKIP |told |rebel_apps: )' build/rebel-apps.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then echo "::error title=Rebel's programs::exit $code, $(grep -E '^rebel_apps: [0-9]' build/rebel-apps.log | tail -n 1)"; fi
          exit "$code"
