# The corpus, on more than one machine.
#
# Everything this project knows about the machine it runs on it learned the hard
# way, and every one of those facts is a place where the other platform can
# diverge in silence:
#
#   - AddressSanitizer has **no leak detector** on Darwin arm64, which is why
#     every generated `main` ends in `hero_runtime_check_leaks()` (panel 021).
#     On Linux the sanitiser's own detector runs *as well*, so this job is the
#     first thing that has ever checked the two against each other;
#   - `INT64_MIN % -1` does not trap on arm64 — it returns 0 at exit 0 — while
#     the same program raises SIGFPE on x86. Same source, two behaviours, and
#     the emitter guards `%` like `/` because of it;
#   - Apple ARM64 passes variadic arguments on the stack, which the FFI ladder
#     met at `curl_easy_setopt`.
#
# Until this file, nothing tested any of it: the whole record was made on one
# laptop. **What runs the corpus is the net, in Heroes** —
# `tests/harness/suite_corpus.hero` compiles and runs every `examples/*/main.hero`
# at `-O0`, at `-O2` and under `-fsanitize=address,undefined`, and `suite_run.hero`
# does the same for `tests/golden/run/`, so the three configurations are inside it
# rather than beside it. It was `cargo test` until 2026-08-19, when `crates/` was
# archived and the four cargo steps left this file.
#
# **The cost premise below has expired, and it was measured rather than read**
# (2026-09-08, M-open-repository). The morning this repository went public, the
# question was left open here on purpose: the documentation says standard
# runners are free in public repositories and says nothing about the operating
# system, and a reading is not a measurement. The account answered it the same
# day, per day, either side of the flip:
#
#     07 Sep, private:  Linux 196 min $1.18 · macOS 50 min $3.10 · Windows 86 min $0.86  ->  $5.14
#     08 Sep, public:   Linux 110 min · macOS 37 min · Windows 50 min · gross $3.45  ->  $0.00
#
# The day before, the monthly allowance was exhausted and every minute was
# charged. The day of the flip the gross is discounted in full, **macOS
# included**. One day of data, so it is a measurement and not yet a law.
#
# **So the reason this matrix narrowed to Linux between tags is gone, and the
# author took the decision on 2026-09-10: it widens.** Every push to `main`
# runs all three legs, once — the milestone tags that used to widen it start no
# run at all now, because the commit they point at has already been judged on
# every platform, and four tags pushed with a branch were starting five runs of
# work that had been done once. The measurements below stay exactly as they
# are, because they were true when they were taken and a record that loses its
# inconvenient half is worth less than none; what they no longer decide is
# which legs run.
#
# **Which machines run is a separate question from which machines exist**, and
# the two answers differ because one leg is not paid for in the same currency
# (author decision 2026-08-16). A macOS runner bills at $0.08/min against
# Windows' $0.016 and Linux' $0.008: measured over 2026-08-13..16, Darwin was
# **26% of the minutes and 70% of the money** — 136 min of 524, $10.88 of
# $15.49 — and the account's spending limit stopped every job on 08-15 at
# 21:44Z. What Darwin buys for that price is the platform the author already
# develops on, so its job re-runs `cargo test` on the one machine that has
# already run it. Linux is the opposite trade: it is the cheapest leg *and* the
# only one whose ASan carries a leak detector, so it runs on everything,
# including a docs-only push — `crates/heroes-cli/tests/milestones.rs` (archived 2026-08-19) reads
# `docs/` and a malformed record is a red `cargo test`.

name: heroes

on:
  push:
    branches: [main]
    # **Milestone tags no longer start a run, by author decision 2026-09-10**,
    # and the reason is the line below it: the matrix runs all three platforms
    # on every push to `main` now, so a `m-*` tag's run was a second full run of
    # a commit this workflow had already judged. `git push --follow-tags` used
    # to start one run per tag plus the branch's, which is five runs for a
    # session that closes four milestones; it starts one. A tag pushed on its
    # own, later, still starts nothing, and that is the trade: the commit it
    # points at was tested when it landed on `main`.
    # Release tags (CLAUDE.md §14, release tags: `vX.Y.Z`, a third namespace
    # beside the milestones' and the site's `site-v*`) stay, because they gain
    # one assert per leg below and are the only ref the `release` job at the end
    # of this file accepts.
    tags: ['v*']
    # The showcase site compiles nothing. `site/` holds HTML, a stylesheet and
    # an Astro build; no file under it is read by the compiler, by the golden
    # harness or by the net, and `heroes` has no site subcommand by §10's
    # stopping rule. So a commit that only touches it was starting a full run of
    # the corpus for no question — measured at roughly seven minutes each.
    #
    # **This is a paths-ignore and not a paths list**, which is the safe
    # direction of the two: a new directory of real code is covered by default
    # and only has to be thought about if somebody wants it skipped. The other
    # spelling fails silently the first time the compiler grows a tree nobody
    # remembered to add.
    #
    # `site/` still has its own gate: `.github/workflows/deploy-site.yml` runs
    # `npm run build` on every push that touches it, so a site that does not
    # build is a red workflow rather than a bad deploy.
    paths-ignore:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/release-site.yml'
  pull_request:
  workflow_dispatch:
    # **One leg at a time, when one leg is what is being fixed.** A full run is
    # three legs and ~7 minutes, and Darwin was billed at ten Linux minutes to
    # the minute — so a session repairing Windows was paying for two legs it
    # had already read, fifteen times over. `all` stays the default, because
    # the reason the three exist is that no platform's failure hides another's.
    # (Past tense on the billing since 2026-09-08: see the header's note on the
    # cost premise, which a public repository may have retired.)
    inputs:
      only:
        description: 'Which legs to run'
        type: choice
        default: all
        options:
          - all
          - windows
          - darwin
          - linux
      # **The mutation score, opted into.** Measured in run 33781889835, the
      # first full three-leg run after the score landed: the step alone cost
      # **1294 s on Linux and 1908 s on Windows**, against 586 s and 1474 s for
      # the whole net, and it took the leg totals to 35m37s and 59m49s where the
      # last run before it was 20m. And the three tables it produces are
      # **identical byte for byte** — Linux's, Windows's, and one measured the
      # same day on the author's Mac (666.37 s): 78 programs, 10878 mutants, 96%
      # killed by `check`, 83% under `--permissive`, every per-operator row
      # equal, `diff` clean on both pairs. So Windows was spending 31m48s to
      # reproduce Linux's number (author decision 2026-09-03, `/decide` answer
      # `1c`: one leg, gated on tags plus this input).
      mutation:
        description: 'Also score the mutations over examples/ (slow; tags always do)'
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

# One run per ref: a second push cancels the first, because a red result about
# code nobody has any more is a red result nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The floor for every job, stated rather than inherited from a repository
# setting (2026-09-08, M-open-repository). `pull_request` above is
# `pull_request` and never `pull_request_target`, so a fork's run already gets a
# read-only token and reaches no secret; this line makes that the workflow's own
# guarantee instead of a property of a checkbox somebody could change without
# reading this file. The `release` job raises itself to `contents: write` where
# it is declared, which is the one place that needs it.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # No platform's failure hides another's. That is the point of having three,
    # and `fail-fast` would undo it on the first divergence.
    strategy:
      fail-fast: false
      # A matrix cannot be narrowed by an `if:` — that covers a whole job, never
      # one leg of it — so the list itself is what the expression chooses, and
      # `fromJSON` turns the chosen string back into the table this file used to
      # spell out. The legs, and what each is here for:
      #
      #   - **Linux x86-64 — every push, including a docs-only one.** The
      #     cheapest leg and the only one whose ASan carries a leak detector, so
      #     it reads `hero_runtime_check_leaks()` (panel 021) against a second
      #     instrument; `INT64_MIN % -1` raises SIGFPE here while arm64 returns
      #     0 at exit 0. Same source, two behaviours. **The local instrument
      #     for this leg is `docs/environment/linux/LINUX-MACHINE.md`**: the same
      #     architecture in a container on the author's Mac, so a Linux fact is
      #     measured before the commit rather than read here seven minutes
      #     after it. This leg stays the judge; that file is the hunt.
      #   - **Darwin arm64 — every push since 2026-09-10, `workflow_dispatch`
      #     to run it alone.** It was narrowed to tags, not for being less
      #     informative but for being *already read*: it is the
      #     author's machine, so a local run of the net is this job, and it was
      #     the only leg billed at ten Linux minutes to the minute (past tense
      #     since 2026-09-08; the header's cost note says why, and that the
      #     replacement is a measurement rather than a reading).
      #     **`macos-14` -> `macos-26` on 2026-09-03** (author decision,
      #     `/decide` answer `2a`), and the reason is that the leg was reporting
      #     NOTHING: in run 33781889835 it died in 16 seconds at `heroes doctor`,
      #     step 7 of 18, and the ten steps after it were skipped. Not a
      #     compiler defect — `macos-14` carries Apple clang 15.0.0 against the
      #     floor of 18 that `selfhost/cli/clang_floor.hero` set the same
      #     morning, so `doctor` was right to exit 2. Read from the
      #     `runner-images` readmes over the API that day (a document, not a
      #     machine): `macos-15` is clang 17.0.0, still under, and `macos-26` is
      #     **21.0.0** — the version the author's own Mac reports, so CI's macOS
      #     toolchain becomes the one this project is developed on instead of
      #     one nobody measures. What this still owes is a run: the image exists
      #     in that document, and that the label is accepted for this repository
      #     has not been executed.
      #   - **Windows x86-64 — every push since 2026-09-10, and it covers the
      #     whole net again as of 2026-08-24.** It was added the day the runtime
      #     could hold it (author instruction 2026-08-14, "I want Windows too")
      #     and it ran the cargo legs, because `runtime/parts/f64.c` compiles
      #     under a Windows target — the 18 errors panel 049 measured were all in
      #     that one file. Those legs left with `crates/` on 2026-08-19, and for five days the
      #     Heroes legs could not replace them: `selfhost/cli/io.hero` bound
      #     `extern "unistd.h"`, so there was no self-hosted compiler on a
      #     platform without POSIX headers, and what was left was a toolchain
      #     report that gated nothing. **That was written down as a loss rather
      #     than absorbed, and the loss is now repaired** (author decision
      #     2026-08-24, `/decide` answers `3a` + `a1`): the port's only raw POSIX
      #     extern became `hero_write_err` in `runtime/parts/os.c` over
      #     `fwrite(…, stderr)`, which is C89, so the seed has no POSIX include
      #     left and every step below runs here.
      #
      #     **UNTESTED ON WINDOWS FROM HERE, and that is stated rather than
      #     implied**: nobody has a Windows machine in this project, so the first
      #     tag run after 2026-08-24 is the instrument for this whole paragraph.
      #     **That stopped being true on 2026-08-31 and the sentence is
      #     corrected rather than deleted**: there is a real Windows box now,
      #     `docs/environment/windows/WINDOWS-MACHINE.md`, reachable in seconds, and it
      #     is where a Windows fact is measured before it reaches this leg. The
      #     leg is still the judge — a green run on that box is evidence, never
      #     the criterion.
      #     Two platform differences are predicted and handled rather than
      #     discovered — `shell: bash` on every step, because `windows-latest`
      #     defaults to `pwsh` and these are bash scripts, and
      #     `matrix.exe`/`.exe` on the built binary, because clang honours `-o`
      #     exactly and Windows will not execute a file without the extension.
      #     A red leg naming something else is the finding, not a regression.
      #
      # Nothing is read at the tag any more, which is what the widening bought:
      # a Windows or macOS divergence is found on the commit that causes it
      # rather than at the next milestone, and the trade this paragraph used to
      # describe — the third platform read at the tag instead of at the commit —
      # is spent. What is still gated is the mutation score, at the bottom of
      # this job: it costs 20 to 30 minutes a leg, produces a table identical on
      # all three, and so runs on a release tag or on request and not on every
      # push.
      matrix:
        include: >-
          ${{ fromJSON(
          (github.event_name == 'workflow_dispatch' && inputs.only == 'windows')
          && '[{"name":"Windows x86-64","os":"windows-latest","exe":".exe"}]'
          || (github.event_name == 'workflow_dispatch' && inputs.only == 'darwin')
          && '[{"name":"Darwin arm64","os":"macos-26","exe":""}]'
          || (github.event_name == 'workflow_dispatch' && inputs.only == 'linux')
          && '[{"name":"Linux x86-64","os":"ubuntu-latest","exe":""}]'
          || '[{"name":"Linux x86-64","os":"ubuntu-latest","exe":""},{"name":"Darwin arm64","os":"macos-26","exe":""},{"name":"Windows x86-64","os":"windows-latest","exe":".exe"}]'
          ) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The two FFI examples bind real libraries: `examples/sqlite/` against the
      # SDK's own `sqlite3.h` with no shim, and `examples/curl/` against
      # libcurl. macOS ships both; Linux needs the headers.
      # clang is named rather than assumed: it is the backend (CLAUDE.md §7), and
      # a job that found it only because the image happened to carry it is a job
      # that breaks when the image changes.
      # pkg-config is what `package "…"` asks, so it is named on every platform
      # rather than assumed. macOS runners carry it via Homebrew.
      - name: Install clang, pkg-config, and the C libraries the FFI examples bind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # raylib is deliberately not installed: `examples/raylib/` is then a
          # live test of the skip rule, which reads the compiler's own
          # `ffi_package` diagnostic rather than a list of program names.
          # lldb is named for the same reason clang is, and it was found missing
          # the hard way: `lldb_breaks_on_a_hero_line` had been *skipping* here
          # since it was written, silently, as a pass — so design.md §2's claim
          # was executed on the author's laptop and nowhere else, which is the
          # exact state the preamble above says this file exists to end.
          sudo apt-get install -y clang lldb pkg-config libsqlite3-dev libcurl4-openssl-dev

      - name: Install what the FFI examples bind
        if: runner.os == 'macOS'
        env:
          # The update is what makes this step slow and noisy, and nothing here
          # needs a newer formula than the image ships.
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # **Ask for the thing the compiler asks for, never for the formula that
          # happens to provide it today** (CLAUDE.md §11: a narrowing asks the
          # value, not the world). `commands/libraries.rs:153` runs
          # `Command::new("pkg-config")` — the executable, by name — and Homebrew
          # renamed that formula to `pkgconf`, so `brew install pkg-config` on a
          # runner that already carries it answers *"pkgconf 2.5.1 is already
          # installed and up-to-date"*. The warning was the formula name aging
          # out from under a check that was asking the wrong question.
          # The runner image taps `aws/tap`, which Homebrew reports as untrusted
          # and — its own words — is "currently ignoring". Nothing this step
          # installs comes from it, so the honest repair is to remove the tap,
          # not to trust it and not HOMEBREW_NO_REQUIRE_TAP_TRUST, which
          # Homebrew itself calls "not recommended". **FIRST, because order is
          # the whole fix**: this line sat AFTER the installs until 2026-08-31,
          # so every brew above it had already preached the warning into the
          # run's annotations — on Actions, brew emits its warnings as
          # ::warning:: lines, which is exactly the badge the author asked
          # about on an all-green run. Both streams silenced on the untap
          # itself, since brew loads the untrusted-tap notice before acting.
          brew untap aws/tap >/dev/null 2>&1 || true
          command -v pkg-config >/dev/null || brew install pkgconf
          # And `pkg-config --exists raylib` is the question `package "raylib"`
          # itself asks, rather than *is the formula present*.
          pkg-config --exists raylib || brew install raylib
          # **`|| true` used to swallow all of this, and that is the defect this
          # step's own neighbour warns about**: the note on the Linux step above
          # records `lldb_breaks_on_a_hero_line` *skipping* here for a milestone,
          # silently, as a pass. A failed install left this job green with
          # `examples/raylib/` skipping — the same shape, one library over. So
          # the step now says whether it did what its name claims.
          # The messages are SINGLE-quoted, and that is not style: a backtick
          # inside a double-quoted shell string is command substitution, so
          # "every `package` binding" runs `package` and prints the sentence with
          # a hole in it. Measured, in this file's own repair.
          command -v pkg-config >/dev/null \
            || { echo '::error::pkg-config is still missing — every `package "…"` binding would fall back to the skip rule'; exit 1; }
          pkg-config --exists raylib \
            || { echo '::error::raylib is still missing — examples/raylib/ would SKIP on the one leg meant to cover it'; exit 1; }

      # Windows carries clang with Visual Studio; pkg-config and the C libraries
      # the FFI examples bind are not there, so this leg is honest about what it
      # covers — the FFI examples SKIP here, which is itself a live test of the
      # skip rule.
      # **This step no longer says the leg gates nothing** (2026-08-24): the
      # steps below it run here now, because `hero_write_err` took the port's
      # only POSIX extern out of the seed. What it still reports is the one thing
      # this platform genuinely does not cover — the debugger — and it reports it
      # rather than gating, so a missing `llvm-pdbutil` is a line in the log and
      # not a red job.
      - name: Report the toolchain
        if: runner.os == 'Windows'
        shell: cmd
        # `llvm-pdbutil` is asked about because of what it would settle, and it is
        # asked as a QUESTION rather than asserted (CLAUDE.md §1: a negative claim
        # rests on the searcher's vocabulary rather than on the world).
        #
        # design.md §2 promises lldb breaks on and steps through `.hero` lines.
        # `lldb_breaks_on_a_hero_line` executes that on Darwin and Linux and skips
        # here, because LLVM's `lldb.exe` exits `0xC0000135` before running a
        # command — a Python DLL, the installer's known gap. The **mapping** itself
        # is covered on all three legs now, by
        # `no_generated_line_points_past_or_between_the_authors_lines`, which reads
        # the emitted C rather than a debugger. What is uncovered here is the
        # debugger leg, and the cheapest way back in would be `llvm-pdbutil`, which
        # reads CodeView out of the 7.7 MB `.pdb` `-g` already writes and — unlike
        # `lldb.exe` — has no reason to link Python. Nobody has checked whether the
        # runner carries it, so the run says so instead of a document guessing.
        # `|| true`: this step reports, it does not gate.
        run: |
          echo "::notice::this leg builds and tests the compiler again as of 2026-08-24 — the seed's POSIX include is gone (hero_write_err). What is still uncovered here is the DEBUGGER: lldb.exe exits 0xC0000135 before running a command. The FFI examples skip for want of pkg-config, which exercises the skip rule."
          clang --version
          where llvm-pdbutil 2>NUL || echo "llvm-pdbutil: not on PATH (DECIDE.md, the third CI leg)"
          where lldb 2>NUL || echo "lldb: not on PATH"

      # ─────────── Nothing here needs cargo, and nothing here is Rust ──────────
      #
      # These four steps need a **C compiler and nothing else**, which is what
      # `crates/` → `archive/bootstrap-rs/` on 2026-08-19 left behind: the seed is C, the
      # compiler it builds is Heroes, and the net is a Heroes program run by that
      # compiler.
      #
      # **The four cargo steps that stood above them are gone** (the archive
      # commit, 2026-08-19): `cargo build`, `cargo run -- doctor`, `cargo clippy`
      # and `cargo test`. They ran beside these for one milestone-step on purpose
      # — a replacement nobody has watched pass is not a replacement — and panel
      # 085 measured what deleting them without a successor would have cost: this
      # file becomes empty.
      #
      # NOT ON WINDOWS, and the reason is the compiler's own source rather than
      # this file's convenience: `selfhost/cli/io.hero` binds `extern
      # "unistd.h"`, so there is no self-hosted compiler on a platform without
      # POSIX headers (2026-08-19) — the same condition `crates/heroes-cli/tests/
      # differential.rs` (archived 2026-08-19) asked of the machine, asked the same way. Windows keeps
      # the cargo legs and says what it covers.
      - name: Build the compiler from the seed — no cargo, no Rust
        shell: bash
        # The command is `seed/README.md`'s own line, unchanged — **including
        # the Windows flag, which that file now prints for the same reason it
        # prints the include path.** A 1 MB main-thread stack against POSIX's 8
        # kills this compiler the first time it is pointed at a module of its
        # own: exit 127, both streams empty, measured here 2026-08-31 and
        # answered by one extra seed build in the same run.
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then STACK="-Wl,/STACK:67108864"; else STACK=""; fi
          clang -I runtime seed/heroes.c runtime/runtime.c $STACK -o heroes-from-seed${{ matrix.exe }}
          ./heroes-from-seed${{ matrix.exe }} --version

      # THE TAG'S NUMBER IS THE BINARY'S NUMBER, asserted on the one ref where
      # the two can disagree (CLAUDE.md §14, release tags). The version lives in
      # one constant, `VERSION` in `selfhost/main.hero`, and moves only in the
      # commit that carries `v<number>`; a tag pushed on a commit that forgot to
      # move it, or moved it to something else, is red here on all three legs
      # before anything is released. `GITHUB_REF_NAME` is the tag itself.
      - name: The release tag names the version the compiler prints
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="heroes ${GITHUB_REF_NAME#v}"
          got="$(./heroes-from-seed${{ matrix.exe }} --version)"
          echo "the tag says:    $want"
          echo "the binary says: $got"
          test "$got" = "$want"

      # THE CONTRACT'S OWN LINE, BUILT AND USED, on the one platform where it
      # can fail. The step above builds with `-Wl,/STACK:67108864`, which is
      # what `seed/README.md` prints for Windows; nothing in this file has ever
      # built WITHOUT it, so the day this compiler's frames grow back past a
      # 1 MB stack the leg would go on passing while the documented instruction
      # was broken. That is exactly how defect 008 stayed green for as long as
      # it existed.
      #
      # Measured on the author's Windows box 2026-09-06, at `bcf6c41a`: the
      # plain line builds a compiler that does `build selfhost/lexer.hero
      # --dump-ir` at exit 0 — the module that died at exit 127 with both
      # streams empty in September — and `build selfhost/main.hero --emit-c`,
      # the whole compiler, also at exit 0. So the flag is headroom now rather
      # than the thing holding the build up.
      #
      # This step ASSERTS rather than reports, and the choice was deliberate:
      # `docs/work/SCHEDULED.md` recommended a reporting step, and a step that
      # only reports is a rule performed by nothing — CLAUDE.md §3's own story
      # about `DECIDE.md` growing to 391 KB, told again in a CI file.
      - name: The documented line, without the Windows flag, still compiles a module
        if: runner.os == 'Windows'
        shell: bash
        run: |
          clang -I runtime seed/heroes.c runtime/runtime.c -o heroes-plain${{ matrix.exe }}
          ./heroes-plain${{ matrix.exe }} build selfhost/lexer.hero --dump-ir > /dev/null

      # The toolchain check as a machine with no Rust would run it. `doctor`
      # names clang, the linker's home, the architecture, the runtime and a
      # writable cache — and it has never asked about cargo, which is what makes
      # this a rename rather than a rewrite.
      - name: heroes doctor, from the seed-built compiler
        shell: bash
        run: ./heroes-from-seed${{ matrix.exe }} doctor

      # The compiler's own tests: 482 of them, inside the modules they test,
      # which is where a Heroes module keeps them.
      #
      # **Tags and `workflow_dispatch` only** (author decision 2026-08-23,
      # `/decide`). Running them means compiling the whole 37,137-line compiler
      # with the compiler: 13 s through the archived Rust bootstrap, **20m35s
      # measured 2026-08-23** through the seed-built one. That is the price of
      # self-hosting and not a regression — but CLAUDE.md §13 says performance is
      # not a licence either, so it is a decision on the record rather than a
      # wait nobody chose. What the tag-only trade gives up is exactly the 482
      # in-module assertions; the net below stays on every push and drives the
      # same compiler over 845 checks. The local loop is untouched: `heroes test`
      # through an already-built binary is the 13 s number again.
      # **The smallest thing the compiler can do, run before the big ones.**
      # Windows reached this point for the first time on 2026-08-31, and the
      # step below it exited 127 with no output at all — which says the process
      # died early and says nothing about where. One program, compiled and run,
      # separates "the compile-and-run cycle is broken on this platform" from
      # "one of 519 tests fails", and those need opposite repairs.
      - name: One program, compiled and run
        run: |
          ./heroes-from-seed${{ matrix.exe }} run examples/gallery/00-first.hero
          echo "exit was $?"

      # **One small module's tests, before the whole compiler's.** Windows now
      # compiles and runs a program (the step above is green there) and then
      # dies at 12 seconds with exit 127 and an empty log on
      # `test selfhost/main.hero`, which is 165 modules and a recursive-descent
      # parser. A silent death after real work is the shape of an exhausted
      # stack, and Windows gives a main thread 1 MB where POSIX gives 8.
      #
      # This step tells the two apart rather than guessing: `lexer.hero` is one
      # module with the same machinery. Green here and red below means depth;
      # red here means something the size has nothing to do with.
      # **Does the error channel reach the log on this platform?** Everything
      # green on Windows so far prints to stdout: `doctor`'s five lines, and the
      # `20` a compiled program printed. Every failure so far has been silent —
      # exit 1 or 127 with an empty log — and a diagnostic goes to stderr. So
      # this asks for a diagnostic on purpose: `arm-pattern.hero` is a golden
      # case that cannot compile, and its message must appear here. Nothing
      # printed means the channel is the defect and not what is written to it.
      # **Asserted, not ignored.** This step used `continue-on-error: true`,
      # which let the deliberate exit 1 through — and stamped every green run
      # with three "Process completed with exit code 1" annotations, one per
      # leg, that read as errors on a page saying Success (author question,
      # 2026-08-31). Ignoring the failure was also weaker than the step's own
      # claim: what it exists to prove is that the diagnostic ARRIVES, so it
      # now demands exactly that — exit 1, the code named on stderr — and a
      # channel that eats the message is a red step instead of a shrug.
      - name: A diagnostic reaches the log
        shell: bash
        run: |
          mkdir -p build
          set +e
          ./heroes-from-seed${{ matrix.exe }} check tests/golden/check/arm-pattern.hero 2> build/diag.txt
          code=$?
          set -e
          cat build/diag.txt
          test "$code" -eq 1
          grep -q 'error\[' build/diag.txt

      # **The same module, checked rather than tested.** Three hypotheses about
      # the silent failure of `heroes test` on Windows are already dead by
      # measurement: stack depth (one module fails too), non-inheritable handles
      # (a compiled program printed `20`), and a mute error channel (the step
      # above prints a full diagnostic with its underline). What is left is the
      # verb itself, and this narrows it one more notch: `check` runs the whole
      # frontend over the same file. Green here means the defect is in what
      # `test` does after the frontend — compiling the test binary and running
      # it once per case.
      - name: The same module, checked
        run: ./heroes-from-seed${{ matrix.exe }} check selfhost/lexer.hero

      # **Emitting, which check does not do.** `check` is green on this module
      # and `test` fails silently, and the gap between them is the backend:
      # `check` stops after the frontend, so clang never sees the `extern`
      # declarations. Emitting C exercises the whole pipeline up to the point
      # where clang is invoked, and `--emit-c` prints the result rather than
      # compiling it. Green here narrows the defect to the C compile itself.
      - name: The same module, emitted
        # No redirection: `> NUL` is cmd's black hole and PowerShell's ordinary
        # FILE, so the previous round may have been throwing away the very
        # output it was asking for. `-o` sends the C to a path and leaves both
        # streams alone.
        # **Everything this probe writes goes under build/, which is
        # gitignored.** The first version wrote `emitted.c` into the repository
        # root and `records/c` caught it on all three legs — that check exists
        # to keep a C file out of a directory that does not own C, and a probe
        # is not an exception to it. The net runs on the same tree a step later,
        # so a probe that litters breaks the run it was meant to diagnose.
        #
        # **And the probe before this one asked the wrong question.** It printed
        # stdout and stderr and both were empty on ALL THREE platforms — because
        # `--emit-c -o path` writes to the path and says nothing. An empty log
        # meant nothing at all, and it was read as evidence. So this one asks
        # for the exit code and the FILE, which are the two things the answer
        # can be read off.
        shell: bash
        run: |
          mkdir -p build/probe
          set +e
          ./heroes-from-seed${{ matrix.exe }} build selfhost/lexer.hero --emit-c \
            -o build/probe/emitted.c > build/probe/out.txt 2> build/probe/err.txt
          code=$?
          set -e
          echo "--- exit $code ---"
          echo "--- the file it was asked to write ---"
          ls -l build/probe/emitted.c 2>&1 || echo "  it is not there"
          echo "--- stdout ---"; head -3 build/probe/out.txt || true
          echo "--- stderr ---"; cat build/probe/err.txt || true
          echo "--- end ---"

      # **--sanitize needs clang's own ASan DLL on PATH, and only Windows asks.**
      # A sanitised binary there loads clang_rt.asan_dynamic-x86_64.dll at start
      # and dies 0xC0000135 (DLL not found) without it — 91 of run/'s 91 checks,
      # measured on the VPS 2026-08-31, and 87 of them green the moment the DLL
      # directory is on PATH. It ships inside clang's resource dir, so clang
      # itself says where it is; nothing is downloaded.
      - name: Put clang's sanitizer runtime on PATH
        if: runner.os == 'Windows'
        shell: bash
        run: |
          D="$(clang -print-resource-dir)/lib/windows"
          ls "$D"/clang_rt.asan_dynamic-x86_64.dll
          echo "$D" >> "$GITHUB_PATH"

      - name: One module's tests, before the whole compiler's
        # `shell: bash` so the shell matches the steps that work. It ran under
        # PowerShell for three rounds, which left "does pwsh eat the streams?"
        # alive as an explanation for an empty log. It is removed as a variable
        # rather than argued about.
        shell: bash
        run: |
          set +e
          ./heroes-from-seed${{ matrix.exe }} test selfhost/lexer.hero
          code=$?
          set -e
          echo "--- exit $code ---"
          exit $code

      # **On every event, including a plain push** (author decision 2026-09-03,
      # `/decide` answer `1`, the same sitting that took the mutation score off
      # two legs — the two halves paid for each other). It was tags and dispatch
      # only, and what that meant is measured: a push leg is 10m54s and this
      # step was **115 s** in run 33781889835, so **553** tests (counted on the
      # author's Mac the same day, 113 s there) were invisible for 2 minutes on
      # 11 — a change that reddens the compiler's own tests could sit on `main`
      # until somebody dispatched or tagged. The gate is cheap and the blind
      # spot was not.
      - name: The compiler's own tests
        shell: bash
        run: ./heroes-from-seed${{ matrix.exe }} test selfhost/main.hero

      # The net: every suite the Rust harness carries, run by the compiler that
      # survives, against the compiler that survives. This is the configuration
      # the archive leaves behind — the one panel 085 R4 called "life after the
      # archive" — so it is the one that has to be green before the move.
      - name: The net, in Heroes
        shell: bash
        run: ./heroes-from-seed${{ matrix.exe }} run tests/harness/main.hero -- ./heroes-from-seed${{ matrix.exe }}

      # THE NET'S OWN TESTS — 81 blocks that nothing ran until 2026-08-25
      # (author decision, `/decide` answer `a`). The two steps above drive the
      # compiler; neither asks whether the thing driving it is right, and while
      # nobody asked, **two of the 81 sat red**: a count that a later commit
      # made wrong (`suite_emission.hero`, `sweep` grew a third check) and a
      # self-test that reached a six-day-old binary because `./heroes` was
      # missing from `shell.hero`'s candidate list while the archived
      # bootstrap's path was on it. One of the cases in this file is called
      # "every check here can fire — CLAUDE.md §9, a check nobody has seen fail
      # is a decoration".
      #
      # **Every push, not tags only**, and the number is why: this compiles the
      # 5,606-line harness rather than the 38,021-line compiler, so it is
      # **13.5 s measured 2026-08-25** against the 20m35s that made the step
      # above tags-only. `HEROES_COMPILER` is named rather than searched for:
      # `some_compiler()` would otherwise walk a candidate list, and a self-test
      # whose verdict depends on which binaries happen to exist is not a test.
      - name: The net's own tests
        shell: bash
        env:
          HEROES_COMPILER: ./heroes-from-seed${{ matrix.exe }}
        run: ./heroes-from-seed${{ matrix.exe }} test tests/harness/main.hero

      # THE MUTATION SCORE OVER THE CORPUS — metric 3 (design.md Part 11), the
      # number the thesis rests on, printed into the log and never asserted:
      # a per-operator rate is the measurement (panel 011) and it moves by
      # design every time a program joins `examples/`. What IS asserted, on
      # every push, is the row in `tests/harness/suite_surface.hero` that runs
      # `mutate examples --operator typo-digit` and wants exit 0 — *the tool
      # reads its corpus* — because on 2026-09-02 `examples/shapes/` landed two
      # modules below a nested root, `mutate` checked them from their own
      # directories, and the corpus was refused at exit 2 for a day with no
      # instrument saying so (measurement 014, M-corpus-depth step 0).
      # Tags and dispatch only: 36 per-directory runs took 680 s on the author's
      # Mac the day this was written, one run over the whole directory is
      # measured in that file, and a push should not pay it (author decision
      # 2026-09-03: the gate on every leg, the score on the tag run).
      #
      # **ONE LEG, AND OPTED INTO ON A DISPATCH** (author decision 2026-09-03,
      # `/decide` answer `1c`; the numbers and the byte-for-byte identity of the
      # three tables are in the `mutation` input's own comment above). Linux is
      # the leg because it is the cheapest of the three and the only one whose
      # ASan also carries a leak detector. Nothing is lost unless the score is
      # platform-dependent, and run 33781889835 measured that it is not — three
      # machines, three architectures, one table.
      #
      # **The day that stops being true, the way to find out must still exist**,
      # so the second half of this condition keeps one door open: a dispatch
      # that narrows to a single leg (`only: windows`, `mutation: yes`) scores
      # on THAT leg. A tag cannot take that door, because `inputs.only` is empty
      # on a tag push and an `!= 'all'` test alone would put the step back on
      # all three legs — which is the thing being removed.
      - name: The mutation score over the corpus
        if: (github.ref_type == 'tag' || inputs.mutation == 'yes') && (matrix.name == 'Linux x86-64' || (github.event_name == 'workflow_dispatch' && inputs.only != 'all'))
        shell: bash
        run: ./heroes-from-seed${{ matrix.exe }} mutate examples

      # THE SEED IS WHAT TODAY'S SOURCE EMITS — and until 2026-08-23 nothing
      # asked. `tests/harness/suite_determinism.hero:13` claimed this repository
      # "now has one that matters — `seed/heroes.c` is checked by `cmp` against
      # what the seed-built compiler emits"; two independent greps found no such
      # check anywhere (panel 087, the compiler-engineer), and the step above
      # builds FROM the seed without ever comparing it. What that let through is
      # the case `seed/README.md`'s two forcing conditions both miss: a change to
      # the LIBRARY TEXT moves neither the ABI assert nor the grammar, so a stale
      # seed builds in 3.4 s and every job after it runs a compiler carrying
      # yesterday's library. A third condition is written down now (author
      # decision 2026-08-23, `/decide`), and this is its instrument.
      #
      # Linux, tags and `workflow_dispatch`: the emission is **15m41s measured**,
      # and Linux is the cheap leg. It is a valid host for the comparison because
      # the emitted C is host-independent, verified rather than assumed —
      # `seed/heroes.c` contains **zero** absolute paths and its `#line`
      # directives carry the relative `selfhost/*.hero` (so any checkout matches
      # from the repository root), and `word_bits`, the one platform-varying
      # quantity the port derives, reaches diagnostics only and never the C.
      # If this ever goes red with a diff that is only spellings, THAT is the
      # finding: the seed would be platform-specific, which nobody has decided,
      # and it goes to `docs/work/DECIDE.md` rather than being papered over.
      # ON EVERY PUSH SINCE 2026-09-05, by author decision, and the gate that
      # used to stand here said `github.ref_type == 'tag'`. What moved it is a
      # number rather than an opinion: `seed/README.md` prices this step at
      # **15m41s**, which is what put it on tags, and it was measured TWICE on
      # a 2026-09-05 Mac at **21.5 s** — the old figure predates the compiler
      # getting fast and went on justifying a decision it no longer justifies.
      # The cost of the gate was paid the same day: `main` was red for a day
      # with a seed two repairs behind, and what noticed was a golden case
      # happening to exist, not an instrument. It stays on the Linux leg and
      # out of the net on purpose — the net is run mid-change, where the seed
      # is deliberately stale until the commit, and an alarm that is always on
      # is one people learn to ignore.
      - name: The seed is what today's source emits
        if: runner.os == 'Linux'
        run: |
          ./heroes-from-seed${{ matrix.exe }} build selfhost/main.hero --emit-c -o /tmp/seed-fresh.c
          cmp seed/heroes.c /tmp/seed-fresh.c

  # THE RELEASE, made by the machine after the three legs agree (CLAUDE.md §14,
  # release tags). What it publishes is the tag's own source archive, which
  # GitHub makes from the tag and which carries the seed inside it, where
  # `seed/README.md` § Why there is no uploaded executable says a seed belongs,
  # and a body assembled from three things already in git: the annotated tag's
  # message (the one paragraph a human writes), the milestone tags between the
  # previous release and this one (the chain), and the diff of
  # `spec/heroes-spec.md` between the two (the language's changelog, because
  # the spec is the whole language). NO BINARY IS UPLOADED: `DESIGN-LOG.md:539`
  # refused prebuilt binaries as a decoy without clang, and a release is not
  # where that refusal expires.
  #
  # The spec assert lives here rather than in the matrix because it needs the
  # previous release tag, which the matrix's `fetch-depth: 1` checkout does not
  # have: while the major is 0, a spec that differs between two releases must
  # have moved the minor (CLAUDE.md §14). On the first release there is no
  # previous tag, and the step says so and passes.
  #
  # `contents: write` is the one permission `gh release create` needs, and it
  # is granted to this job alone; the matrix above keeps the default.
  release:
    name: GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: A moved spec moved the minor
        shell: bash
        run: |
          this="$GITHUB_REF_NAME"
          prev="$(git tag --list 'v*' --sort=creatordate --merged "$this" | grep -v "^${this}\$" | tail -n 1)"
          if [ -z "$prev" ]; then
            echo "first release: no previous v* tag to compare the spec against"
            exit 0
          fi
          echo "previous release: $prev"
          if git diff --quiet "$prev" "$this" -- spec/heroes-spec.md; then
            echo "spec/heroes-spec.md is identical between $prev and $this"
            exit 0
          fi
          major="$(echo "${this#v}" | cut -d. -f1)"
          if [ "$major" != "0" ]; then
            echo "major is $major: the 0.x rule does not apply, and what 1.x promises is the gate's paragraph"
            exit 0
          fi
          pm="$(echo "${prev#v}" | cut -d. -f2)"
          tm="$(echo "${this#v}" | cut -d. -f2)"
          echo "the spec moved between $prev and $this; minor $pm -> $tm"
          test "$tm" -gt "$pm" \
            || { echo "::error::spec/heroes-spec.md differs between $prev and $this and the minor did not move (CLAUDE.md §14, release tags)"; exit 1; }

      - name: Assemble the notes from git
        shell: bash
        run: |
          this="$GITHUB_REF_NAME"
          prev="$(git tag --list 'v*' --sort=creatordate --merged "$this" | grep -v "^${this}\$" | tail -n 1)"
          {
            git for-each-ref "refs/tags/$this" --format='%(contents)'
            echo
            echo "## Milestones closed since ${prev:-the beginning}"
            echo
            if [ -n "$prev" ]; then
              comm -13 <(git tag --list 'm-*' --merged "$prev" | sort) <(git tag --list 'm-*' --merged "$this" | sort) | sed 's/^/- /'
            else
              git tag --list 'm*' --merged "$this" --sort=creatordate | sed 's/^/- /'
            fi
            echo
            echo "## The language: spec/heroes-spec.md since ${prev:-the beginning}"
            echo
            if [ -n "$prev" ]; then
              if git diff --quiet "$prev" "$this" -- spec/heroes-spec.md; then
                echo "No sentence of the spec changed: this is a patch release."
              else
                echo '```diff'
                git diff "$prev" "$this" -- spec/heroes-spec.md
                echo '```'
              fi
            else
              echo "A first release has no diff to show: the whole of spec/heroes-spec.md at this tag is the language."
            fi
          } > build-notes.md
          cat build-notes.md

      - name: Create the release, with no uploaded binary
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "heroes ${GITHUB_REF_NAME#v}" --notes-file build-notes.md
