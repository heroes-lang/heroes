# The corpus, on more than one machine.
#
# Everything this project knows about the machine it runs on it learned the hard
# way, and every one of those facts is a place where the other platform can
# diverge in silence:
#
#   - AddressSanitizer has **no leak detector** on Darwin arm64, which is why
#     every generated `main` ends in `hero_runtime_check_leaks()` (panel 021).
#     On Linux the sanitiser's own detector runs *as well*, so this job is the
#     first thing that has ever checked the two against each other;
#   - `INT64_MIN % -1` does not trap on arm64 — it returns 0 at exit 0 — while
#     the same program raises SIGFPE on x86. Same source, two behaviours, and
#     the emitter guards `%` like `/` because of it;
#   - Apple ARM64 passes variadic arguments on the stack, which the FFI ladder
#     met at `curl_easy_setopt`.
#
# Until this file, nothing tested any of it: the whole record was made on one
# laptop. **What runs the corpus is the net, in Heroes** —
# `tests/harness/suite_corpus.hero` compiles and runs every `examples/*/main.hero`
# at `-O0`, at `-O2` and under `-fsanitize=address,undefined`, and `suite_run.hero`
# does the same for `tests/golden/run/`, so the three configurations are inside it
# rather than beside it. It was `cargo test` until 2026-08-19, when `crates/` was
# archived and the four cargo steps left this file.
#
# **Which machines run is a separate question from which machines exist**, and
# the two answers differ because one leg is not paid for in the same currency
# (author decision 2026-08-16). A macOS runner bills at $0.08/min against
# Windows' $0.016 and Linux' $0.008: measured over 2026-08-13..16, Darwin was
# **26% of the minutes and 70% of the money** — 136 min of 524, $10.88 of
# $15.49 — and the account's spending limit stopped every job on 08-15 at
# 21:44Z. What Darwin buys for that price is the platform the author already
# develops on, so its job re-runs `cargo test` on the one machine that has
# already run it. Linux is the opposite trade: it is the cheapest leg *and* the
# only one whose ASan carries a leak detector, so it runs on everything,
# including a docs-only push — `crates/heroes-cli/tests/milestones.rs` reads
# `docs/` and a malformed record is a red `cargo test`.

name: heroes

on:
  push:
    branches: [main]
    # Milestone tags (CLAUDE.md §14: the id lowercased, `m-<what-it-delivers>`)
    # are what widens the matrix below to all three platforms. `git push
    # --follow-tags` therefore starts two runs — the branch's Linux-only one and
    # the tag's full one — because `concurrency` keys on `github.ref` and a
    # branch is not its tag. That duplicate is one Linux job per milestone.
    tags: ['m-*']
  pull_request:
  workflow_dispatch:

# One run per ref: a second push cancels the first, because a red result about
# code nobody has any more is a red result nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # No platform's failure hides another's. That is the point of having three,
    # and `fail-fast` would undo it on the first divergence.
    strategy:
      fail-fast: false
      # A matrix cannot be narrowed by an `if:` — that covers a whole job, never
      # one leg of it — so the list itself is what the expression chooses, and
      # `fromJSON` turns the chosen string back into the table this file used to
      # spell out. The legs, and what each is here for:
      #
      #   - **Linux x86-64 — every push, including a docs-only one.** The
      #     cheapest leg and the only one whose ASan carries a leak detector, so
      #     it reads `hero_runtime_check_leaks()` (panel 021) against a second
      #     instrument; `INT64_MIN % -1` raises SIGFPE here while arm64 returns
      #     0 at exit 0. Same source, two behaviours.
      #   - **Darwin arm64 — tags and `workflow_dispatch`.** Not narrowed for
      #     being less informative but for being *already read*: it is the
      #     author's machine, so a local run of the net is this job, and it is
      #     the only leg billed at ten Linux minutes to the minute.
      #   - **Windows x86-64 — tags and `workflow_dispatch`, and the archive cost
      #     it almost everything.** It was added the day the runtime could hold it
      #     (author instruction 2026-08-14, "I want Windows too") and it ran the
      #     cargo legs, because `runtime/parts/f64.c` compiles under a Windows
      #     target — the 18 errors panel 049 measured were all in that one file.
      #     Those legs are gone with `crates/`, and the Heroes legs cannot replace
      #     them here: `selfhost/cli_io.hero` binds `extern "unistd.h"`, so there
      #     is no self-hosted compiler on a platform without POSIX headers. What
      #     is left is the toolchain report below, which gates nothing and says so.
      #     **That is a loss and it is written down rather than absorbed**
      #     (`docs/debrief/DECIDE.md`): the honest answers are to give the port a
      #     Windows I/O path, or to drop the leg. Keeping a green job that tests
      #     nothing is the shape CLAUDE.md §9 calls a decoration.
      #
      # Nothing is untested by this: the third platform is read at the tag
      # instead of at the commit, which is the trade CLAUDE.md §14's per-
      # milestone tag already makes for every other record.
      matrix:
        include: >-
          ${{ fromJSON(
          (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
          && '[{"name":"Linux x86-64","os":"ubuntu-latest"},{"name":"Darwin arm64","os":"macos-14"},{"name":"Windows x86-64","os":"windows-latest"}]'
          || '[{"name":"Linux x86-64","os":"ubuntu-latest"}]'
          ) }}

    steps:
      - uses: actions/checkout@v5

      # The two FFI examples bind real libraries: `examples/sqlite/` against the
      # SDK's own `sqlite3.h` with no shim, and `examples/curl/` against
      # libcurl. macOS ships both; Linux needs the headers.
      # clang is named rather than assumed: it is the backend (CLAUDE.md §7), and
      # a job that found it only because the image happened to carry it is a job
      # that breaks when the image changes.
      # pkg-config is what `package "…"` asks, so it is named on every platform
      # rather than assumed. macOS runners carry it via Homebrew.
      - name: Install clang, pkg-config, and the C libraries the FFI examples bind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # raylib is deliberately not installed: `examples/raylib/` is then a
          # live test of the skip rule, which reads the compiler's own
          # `ffi_package` diagnostic rather than a list of program names.
          # lldb is named for the same reason clang is, and it was found missing
          # the hard way: `lldb_breaks_on_a_hero_line` had been *skipping* here
          # since it was written, silently, as a pass — so design.md §2's claim
          # was executed on the author's laptop and nowhere else, which is the
          # exact state the preamble above says this file exists to end.
          sudo apt-get install -y clang lldb pkg-config libsqlite3-dev libcurl4-openssl-dev

      - name: Install what the FFI examples bind
        if: runner.os == 'macOS'
        env:
          # The update is what makes this step slow and noisy, and nothing here
          # needs a newer formula than the image ships.
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # **Ask for the thing the compiler asks for, never for the formula that
          # happens to provide it today** (CLAUDE.md §11: a narrowing asks the
          # value, not the world). `commands/libraries.rs:153` runs
          # `Command::new("pkg-config")` — the executable, by name — and Homebrew
          # renamed that formula to `pkgconf`, so `brew install pkg-config` on a
          # runner that already carries it answers *"pkgconf 2.5.1 is already
          # installed and up-to-date"*. The warning was the formula name aging
          # out from under a check that was asking the wrong question.
          command -v pkg-config >/dev/null || brew install pkgconf
          # And `pkg-config --exists raylib` is the question `package "raylib"`
          # itself asks, rather than *is the formula present*.
          pkg-config --exists raylib || brew install raylib
          # The runner taps `aws/tap`, which Homebrew reports as untrusted and —
          # its own words — is "currently ignoring". Nothing installed above
          # comes from it, so the honest repair is to remove the tap rather than
          # to trust it or to set HOMEBREW_NO_REQUIRE_TAP_TRUST, which Homebrew
          # itself calls "not recommended".
          brew untap aws/tap 2>/dev/null || true
          # **`|| true` used to swallow all of this, and that is the defect this
          # step's own neighbour warns about**: the note on the Linux step above
          # records `lldb_breaks_on_a_hero_line` *skipping* here for a milestone,
          # silently, as a pass. A failed install left this job green with
          # `examples/raylib/` skipping — the same shape, one library over. So
          # the step now says whether it did what its name claims.
          # The messages are SINGLE-quoted, and that is not style: a backtick
          # inside a double-quoted shell string is command substitution, so
          # "every `package` binding" runs `package` and prints the sentence with
          # a hole in it. Measured, in this file's own repair.
          command -v pkg-config >/dev/null \
            || { echo '::error::pkg-config is still missing — every `package "…"` binding would fall back to the skip rule'; exit 1; }
          pkg-config --exists raylib \
            || { echo '::error::raylib is still missing — examples/raylib/ would SKIP on the one leg meant to cover it'; exit 1; }

      # Windows carries clang with Visual Studio; pkg-config and the C libraries
      # the FFI examples bind are not there, so this leg is honest about what it
      # covers — see the note in `corpus.rs`.
      # Windows reports and gates nothing — see the matrix note. The `::warning::`
      # is deliberate: a leg that has stopped covering what it was added for
      # should say so on every run, not once in a comment nobody opens.
      - name: Report the toolchain
        if: runner.os == 'Windows'
        # `llvm-pdbutil` is asked about because of what it would settle, and it is
        # asked as a QUESTION rather than asserted (CLAUDE.md §1: a negative claim
        # rests on the searcher's vocabulary rather than on the world).
        #
        # design.md §2 promises lldb breaks on and steps through `.hero` lines.
        # `lldb_breaks_on_a_hero_line` executes that on Darwin and Linux and skips
        # here, because LLVM's `lldb.exe` exits `0xC0000135` before running a
        # command — a Python DLL, the installer's known gap. The **mapping** itself
        # is covered on all three legs now, by
        # `no_generated_line_points_past_or_between_the_authors_lines`, which reads
        # the emitted C rather than a debugger. What is uncovered here is the
        # debugger leg, and the cheapest way back in would be `llvm-pdbutil`, which
        # reads CodeView out of the 7.7 MB `.pdb` `-g` already writes and — unlike
        # `lldb.exe` — has no reason to link Python. Nobody has checked whether the
        # runner carries it, so the run says so instead of a document guessing.
        # `|| true`: this step reports, it does not gate.
        run: |
          echo "::warning::this leg covers the toolchain only. The cargo steps left with `crates/` (2026-08-19) and the self-hosted compiler cannot be built here: selfhost/cli_io.hero binds unistd.h. See docs/debrief/DECIDE.md."
          clang --version
          where llvm-pdbutil 2>NUL || echo "llvm-pdbutil: not on PATH (DECIDE.md, the third CI leg)"
          where lldb 2>NUL || echo "lldb: not on PATH"

      # ─────────── Nothing here needs cargo, and nothing here is Rust ──────────
      #
      # These four steps need a **C compiler and nothing else**, which is what
      # `crates/` → `archive/bootstrap-rs/` left behind: the seed is C, the
      # compiler it builds is Heroes, and the net is a Heroes program run by that
      # compiler.
      #
      # **The four cargo steps that stood above them are gone** (the archive
      # commit, 2026-08-19): `cargo build`, `cargo run -- doctor`, `cargo clippy`
      # and `cargo test`. They ran beside these for one milestone-step on purpose
      # — a replacement nobody has watched pass is not a replacement — and panel
      # 085 measured what deleting them without a successor would have cost: this
      # file becomes empty.
      #
      # NOT ON WINDOWS, and the reason is the compiler's own source rather than
      # this file's convenience: `selfhost/cli_io.hero` binds `extern
      # "unistd.h"`, so there is no self-hosted compiler on a platform without
      # POSIX headers — the same condition `crates/heroes-cli/tests/
      # differential.rs` asks of the machine, asked the same way. Windows keeps
      # the cargo legs and says what it covers.
      - name: Build the compiler from the seed — no cargo, no Rust
        if: runner.os != 'Windows'
        # The command is `seed/README.md`'s own line, unchanged. If the real
        # build ever needs a flag that file does not print, this goes red — the
        # same pin `the_seed_builds_from_a_clean_checkout` puts on it.
        run: |
          clang -I runtime seed/heroes.c runtime/runtime.c -o heroes-from-seed
          ./heroes-from-seed --version

      # **One step that exists to score a prediction**, which is the only way a
      # prediction pays (panel 046 R1). Panel 085's ffi-pragmatist predicted that
      # `-std=c11` on **glibc** fails at the seed's `unistd.h` extern for want of
      # a feature-test macro, and named *the first CI run of the seed on Linux*
      # as the instrument. This is it. Measured on Darwin the same day: `-std=c11`
      # builds the seed in 3.6 s and produces a working binary, which is what
      # panel 047 predicts — `__STRICT_ANSI__` hides `strdup`, `fileno` and
      # `M_PI` **on glibc**, not on Darwin's headers. The seed's own documented
      # command passes no `-std` at all, so nothing here gates on the answer: the
      # step reports it, loudly enough to read in the log.
      - name: Score panel 085 — does `-std=c11` build the seed on glibc?
        if: runner.os == 'Linux'
        run: |
          if clang -std=c11 -I runtime seed/heroes.c runtime/runtime.c -o /tmp/heroes-c11; then
            echo "::notice::panel 085 ffi-pragmatist FALSIFIED: -std=c11 builds the seed on glibc"
          else
            echo "::notice::panel 085 ffi-pragmatist HELD: -std=c11 fails on glibc, as predicted"
          fi

      # The toolchain check as a machine with no Rust would run it. `doctor`
      # names clang, the linker's home, the architecture, the runtime and a
      # writable cache — and it has never asked about cargo, which is what makes
      # this a rename rather than a rewrite.
      - name: heroes doctor, from the seed-built compiler
        if: runner.os != 'Windows'
        run: ./heroes-from-seed doctor

      # The compiler's own tests: 482 of them, inside the modules they test,
      # which is where a Heroes module keeps them.
      #
      # **Tags and `workflow_dispatch` only** (author decision 2026-08-23,
      # `/decide`). Running them means compiling the whole 37,137-line compiler
      # with the compiler: 13 s through the archived Rust bootstrap, **20m35s
      # measured 2026-08-23** through the seed-built one. That is the price of
      # self-hosting and not a regression — but CLAUDE.md §13 says performance is
      # not a licence either, so it is a decision on the record rather than a
      # wait nobody chose. What the tag-only trade gives up is exactly the 482
      # in-module assertions; the net below stays on every push and drives the
      # same compiler over 845 checks. The local loop is untouched: `heroes test`
      # through an already-built binary is the 13 s number again.
      - name: The compiler's own tests
        if: runner.os != 'Windows' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        run: ./heroes-from-seed test selfhost/main.hero

      # The net: every suite the Rust harness carries, run by the compiler that
      # survives, against the compiler that survives. This is the configuration
      # the archive leaves behind — the one panel 085 R4 called "life after the
      # archive" — so it is the one that has to be green before the move.
      - name: The net, in Heroes
        if: runner.os != 'Windows'
        run: ./heroes-from-seed run tests/harness/main.hero -- ./heroes-from-seed

      # THE SEED IS WHAT TODAY'S SOURCE EMITS — and until 2026-08-23 nothing
      # asked. `tests/harness/suite_determinism.hero:13` claimed this repository
      # "now has one that matters — `seed/heroes.c` is checked by `cmp` against
      # what the seed-built compiler emits"; two independent greps found no such
      # check anywhere (panel 087, the compiler-engineer), and the step above
      # builds FROM the seed without ever comparing it. What that let through is
      # the case `seed/README.md`'s two forcing conditions both miss: a change to
      # the LIBRARY TEXT moves neither the ABI assert nor the grammar, so a stale
      # seed builds in 3.4 s and every job after it runs a compiler carrying
      # yesterday's library. A third condition is written down now (author
      # decision 2026-08-23, `/decide`), and this is its instrument.
      #
      # Linux, tags and `workflow_dispatch`: the emission is **15m41s measured**,
      # and Linux is the cheap leg. It is a valid host for the comparison because
      # the emitted C is host-independent, verified rather than assumed —
      # `seed/heroes.c` contains **zero** absolute paths and its `#line`
      # directives carry the relative `selfhost/*.hero` (so any checkout matches
      # from the repository root), and `word_bits`, the one platform-varying
      # quantity the port derives, reaches diagnostics only and never the C.
      # If this ever goes red with a diff that is only spellings, THAT is the
      # finding: the seed would be platform-specific, which nobody has decided,
      # and it goes to `docs/debrief/DECIDE.md` rather than being papered over.
      - name: The seed is what today's source emits
        if: runner.os == 'Linux' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        run: |
          ./heroes-from-seed build selfhost/main.hero --emit-c -o /tmp/seed-fresh.c
          cmp seed/heroes.c /tmp/seed-fresh.c
