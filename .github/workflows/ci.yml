# The corpus, on more than one machine.
#
# Everything this project knows about the machine it runs on it learned the hard
# way, and every one of those facts is a place where the other platform can
# diverge in silence:
#
#   - AddressSanitizer has **no leak detector** on Darwin arm64, which is why
#     every generated `main` ends in `hero_runtime_check_leaks()` (panel 021).
#     On Linux the sanitiser's own detector runs *as well*, so this job is the
#     first thing that has ever checked the two against each other;
#   - `INT64_MIN % -1` does not trap on arm64 — it returns 0 at exit 0 — while
#     the same program raises SIGFPE on x86. Same source, two behaviours, and
#     the emitter guards `%` like `/` because of it;
#   - Apple ARM64 passes variadic arguments on the stack, which the FFI ladder
#     met at `curl_easy_setopt`.
#
# Until this file, nothing tested any of it: the whole record was made on one
# laptop. `cargo test` is what runs the corpus — `tests/corpus.rs` compiles and
# runs every `examples/*/main.hero` at `-O0`, at `-O2` and under
# `-fsanitize=address,undefined`, and `tests/golden.rs` does the same for
# `tests/golden/run/` — so the three configurations are inside it rather than
# beside it.
#
# **Which machines run is a separate question from which machines exist**, and
# the two answers differ because one leg is not paid for in the same currency
# (author decision 2026-08-16). A macOS runner bills at $0.08/min against
# Windows' $0.016 and Linux' $0.008: measured over 2026-08-13..16, Darwin was
# **26% of the minutes and 70% of the money** — 136 min of 524, $10.88 of
# $15.49 — and the account's spending limit stopped every job on 08-15 at
# 21:44Z. What Darwin buys for that price is the platform the author already
# develops on, so its job re-runs `cargo test` on the one machine that has
# already run it. Linux is the opposite trade: it is the cheapest leg *and* the
# only one whose ASan carries a leak detector, so it runs on everything,
# including a docs-only push — `crates/heroes-cli/tests/milestones.rs` reads
# `docs/` and a malformed record is a red `cargo test`.

name: heroes

on:
  push:
    branches: [main]
    # Milestone tags (CLAUDE.md §14: the id lowercased, `m-<what-it-delivers>`)
    # are what widens the matrix below to all three platforms. `git push
    # --follow-tags` therefore starts two runs — the branch's Linux-only one and
    # the tag's full one — because `concurrency` keys on `github.ref` and a
    # branch is not its tag. That duplicate is one Linux job per milestone.
    tags: ['m-*']
  pull_request:
  workflow_dispatch:

# One run per ref: a second push cancels the first, because a red result about
# code nobody has any more is a red result nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # No platform's failure hides another's. That is the point of having three,
    # and `fail-fast` would undo it on the first divergence.
    strategy:
      fail-fast: false
      # A matrix cannot be narrowed by an `if:` — that covers a whole job, never
      # one leg of it — so the list itself is what the expression chooses, and
      # `fromJSON` turns the chosen string back into the table this file used to
      # spell out. The legs, and what each is here for:
      #
      #   - **Linux x86-64 — every push, including a docs-only one.** The
      #     cheapest leg and the only one whose ASan carries a leak detector, so
      #     it reads `hero_runtime_check_leaks()` (panel 021) against a second
      #     instrument; `INT64_MIN % -1` raises SIGFPE here while arm64 returns
      #     0 at exit 0. Same source, two behaviours.
      #   - **Darwin arm64 — tags and `workflow_dispatch`.** Not narrowed for
      #     being less informative but for being *already read*: it is the
      #     author's machine, so a local `cargo test` is this job, and it is the
      #     only leg billed at ten Linux minutes to the minute.
      #   - **Windows x86-64 — tags and `workflow_dispatch`. The third leg,
      #     added the day the runtime could hold it** (author instruction
      #     2026-08-14, "I want Windows too"). It is here because
      #     `runtime/parts/f64.c` now compiles under a Windows target — the 18
      #     errors panel 049 measured were all in that one file — and not because
      #     the platform was named. A name in a document is a promise; a job is a
      #     measurement. It rides with Darwin rather than with Linux because
      #     nothing local reproduces it, so its result is worth having at the
      #     moment somebody is looking at one.
      #
      # Nothing is untested by this: the third platform is read at the tag
      # instead of at the commit, which is the trade CLAUDE.md §14's per-
      # milestone tag already makes for every other record.
      matrix:
        include: >-
          ${{ fromJSON(
          (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
          && '[{"name":"Linux x86-64","os":"ubuntu-latest"},{"name":"Darwin arm64","os":"macos-14"},{"name":"Windows x86-64","os":"windows-latest"}]'
          || '[{"name":"Linux x86-64","os":"ubuntu-latest"}]'
          ) }}

    steps:
      - uses: actions/checkout@v5

      # The two FFI examples bind real libraries: `examples/sqlite/` against the
      # SDK's own `sqlite3.h` with no shim, and `examples/curl/` against
      # libcurl. macOS ships both; Linux needs the headers.
      # clang is named rather than assumed: it is the backend (CLAUDE.md §7), and
      # a job that found it only because the image happened to carry it is a job
      # that breaks when the image changes.
      # pkg-config is what `package "…"` asks, so it is named on every platform
      # rather than assumed. macOS runners carry it via Homebrew.
      - name: Install clang, pkg-config, and the C libraries the FFI examples bind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # raylib is deliberately not installed: `examples/raylib/` is then a
          # live test of the skip rule, which reads the compiler's own
          # `ffi_package` diagnostic rather than a list of program names.
          # lldb is named for the same reason clang is, and it was found missing
          # the hard way: `lldb_breaks_on_a_hero_line` had been *skipping* here
          # since it was written, silently, as a pass — so design.md §2's claim
          # was executed on the author's laptop and nowhere else, which is the
          # exact state the preamble above says this file exists to end.
          sudo apt-get install -y clang lldb pkg-config libsqlite3-dev libcurl4-openssl-dev

      # **No toolchain step, on purpose.** `rust-toolchain.toml` pins the version
      # and `rustup` — preinstalled on both runners — honours it for every
      # `cargo` invocation in this directory. An action naming a version here
      # would be a second home for the same number, and the first run of this
      # workflow is what proved the cost: clippy 1.97 rejected forty `vec![…]`
      # lines that clippy 1.90 accepts, and local and CI had never been compared.
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install what the FFI examples bind
        if: runner.os == 'macOS'
        run: brew install pkg-config raylib || true

      # Windows carries clang with Visual Studio; pkg-config and the C libraries
      # the FFI examples bind are not there, so this leg is honest about what it
      # covers — see the note in `corpus.rs`.
      - name: Report the toolchain
        if: runner.os == 'Windows'
        run: clang --version

      - name: Build the compiler
        run: cargo build

      # The toolchain check, before anything asks it to compile C. It is the one
      # command that reports what this machine actually has, and the `arch` line
      # in its output is how a reader tells the three jobs apart at a glance.
      # `cargo run` rather than a path, because the path has a `.exe` on one of
      # them and a leading `./` on the others.
      - name: heroes doctor
        run: cargo run --quiet -- doctor

      # The Cyclone rule (CLAUDE.md §5) and every lint the repo has agreed to.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Everything: the crate tests, the golden harnesses, the CLI surface, and
      # the corpus in its three configurations.
      - name: cargo test
        run: cargo test
