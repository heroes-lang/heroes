name: Deploy site

# The site's only deploy path.
#
# The site is an Astro project: `npm run build` turns `site/src/` into
# `site/dist/`, and wrangler uploads that. `site/public/` still exists and is
# still deployed, but it holds the assets alone now — the stylesheet, the
# portrait, robots.txt, llms.txt — and Astro copies it into `dist/` on its way.
# The holding page left it when the site was published: it is dormant in
# `site/parking/`, whose README says how to re-arm it.
#
# What reaches Cloudflare is a DIRECT UPLOAD: the files are finished before they
# leave here, so the deploy spends none of the 500 builds a month the Pages Free
# plan allows. Cloudflare's own git integration would spend one on every push to
# `main`, most of which touch only the compiler. Use one path or the other and
# never both: the native integration stays disabled.
#
# What it does spend is Actions minutes, against 2,000 a month on the free tier
# for a private repository, and this job is under a minute.
#
# Triggered when the site changes, on demand from the Actions tab, and from
# `release-site.yml` when a `site-v*` tag is pushed.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  workflow_call:

# One group for every trigger, so a tag pushed alongside its own commit does not
# deploy the same tree twice.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # Declared at JOB level, not on the step, because a step's own `env` is not
    # visible to that step's `if`. The effect is that a clone or a fork without
    # the secrets stays green and simply skips the deploy, instead of failing on
    # a credential it was never given.
    env:
      CF_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'true' || 'false' }}

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v7

      # Node 22 rather than the newest: it is Astro's current LTS target and the
      # version the other site in this account builds under, so a break here is
      # a break in the site rather than in the runner's Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the lockfile and
      # fails if package.json and the lockfile disagree, which is the whole
      # reason the lockfile is committed.
      - run: npm ci
      - run: npm run build

      # No artifact upload. The deploy step below reads site/dist straight from
      # the workspace, so a second copy in Actions storage would buy nothing.

      # Requires two repository secrets:
      #   CLOUDFLARE_API_TOKEN   a custom token carrying Cloudflare Pages: Edit
      #   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
      # Their shape and the permissions behind them are documented in
      # `.env.example`, and the architecture in `site/README.md` § Deployment.
      #
      # This step runs from `site/`, like every other step in the job. Wrangler
      # collects Pages Functions from a `functions/` directory in the working
      # directory it is run from, never from inside the output directory it is
      # handed. There is no `site/functions/` since 2026-09-03, because the pre-launch gate
      # was disarmed by moving it to `site/parking/`, and that is exactly why
      # this comment stays: the day it is re-armed, this step's
      # `working-directory` and the catch-all's location are one decision. Get
      # them apart and the deploy still succeeds, silently, with every URL of
      # the site open and nothing in the log to say so.
      #
      # `--branch=main` marks the upload as PRODUCTION, including when the run
      # was started by a tag rather than by a push to main.
      - name: Deploy to Cloudflare Pages
        if: env.CF_DEPLOY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=heroes-lang-site \
            --branch=main
