# Code scanning, by CodeQL, as a workflow of this repository rather than
# GitHub's default setup (defect 674, 2026-10-12).
#
# **Why not the default setup.** It was switched on on 2026-10-11 and its first
# run never finished. Run 38131878650 analysed actions, javascript-typescript,
# python and rust in one to two minutes each; its c-cpp job was cancelled at
# GitHub's six-hour limit, 10:25:13Z to 16:25:23Z, still extracting. The default
# setup has no build to follow, so it extracts C with none: every `.c` and `.h`
# it finds, 710 and 604 files at `fb938e273`, about 96 MB of them generated by
# this compiler (`seed/heroes.c` alone 52 MB, the 599 snapshots of
# `tests/emission/` 44 MB) against 0.7 MB written by hand. Which file held it
# six hours the log does not say (unrun). The run ending `cancelled` also
# skipped the setup's own `Adjust Configuration` job, and no analysis ran after
# it: six pushes to `main` started none, and the eight alerts batch 22 repaired
# stood open on that commit (measured over the API, 2026-10-12).
#
# **The default setup is off, and the two cannot both be on**: while it is
# configured, an upload of CodeQL results is refused, *Upload with CodeQL
# results rejected due to "default setup"* (GitHub's documentation, read
# 2026-10-12, not run here). The author switched it off
# in the repository's settings on 2026-10-12, and `code-scanning/default-setup`
# answered `state: not-configured` before this file was committed. Switching
# it on again would refuse every upload of this file.
#
# **What this file analyses for C is the hand-written C, which is the runtime,
# compiled as the compiler compiles it.** The compiler is built from the seed
# BEFORE CodeQL starts tracing, so the seed is compiled and never extracted;
# then one `heroes build` is traced, and the clang it runs over
# `runtime/runtime.c` (one translation unit, its 25 parts `#include`d) is what
# CodeQL reads, with the compiler's own words from `selfhost/cli/flags.hero`
# rather than a copy of them here that could drift from it. Measured on the
# author's Mac 2026-10-12 with the CLI of the runner's release, 2.27.2, in a
# copy of the tree with a cold cache: the traced build 10.48 s, the
# `cpp-code-scanning` suite 6.78 s, 33 files (the runtime's) and 0 results.
# That read the runtime's `__APPLE__` branches; this leg reads its `__linux__`
# ones, and what it finds there is its first run's (unrun). The `_WIN32`
# branches are read by neither.
#
# **The other three languages are the default setup's**, with no build and under
# the same categories, `/language:<name>`, so the alerts the default setup
# opened are the ones these analyses close or keep. That the alerts carry over
# from one setup to the other is read at this workflow's first run (unrun).
#
# **Rust left the matrix on 2026-10-19** (defect 2149): the Rust bootstrap left
# the tree with M-witnessed-seed's step 6, and CodeQL refuses a language the
# repository holds no code of, *CodeQL detected code written in C/C++, HTML,
# Python, JavaScript/TypeScript and GitHub Actions, but not any written in
# Rust*, exit 32: the scheduled run of that morning was red on it alone.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly as the default setup was, so a new query in CodeQL's own suite
  # reaches code nobody has touched since.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

# One run per ref, as `ci.yml`: an analysis of a commit nobody has any more is
# one nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # **The bound the default setup lacked.** Its c-cpp job held a runner six
    # hours, GitHub's own ceiling, and nothing here would have stopped it
    # sooner. The slowest analysis of that run finished in under two minutes
    # and the C measured above in under twenty seconds, so thirty minutes is a
    # ceiling a working run never meets and a hang reaches in half an hour.
    timeout-minutes: 30
    # `security-events: write` uploads the results and is the one grant this
    # needs; `actions: read` and `packages: read` serve private repositories
    # and private query packs, and this repository is public with neither.
    permissions:
      contents: read
      security-events: write
    # **No overlay database where the build is traced** (defect 2223). On the
    # default branch the action asks for an overlay-base database, the base of
    # the incremental analysis it runs on a pull request, and with
    # `build-mode: manual` it cannot build one: from 2026-10-22 to 25 each of
    # the c-cpp leg's twelve runs read *Cannot build an overlay-base database
    # because build-mode is set to "manual" instead of "none"*, a warning, and
    # fell back to the full database this file wants. `none` says so before the
    # action asks (its `src/config-utils.ts`, lines 730 to 743, at the v4.38.3
    # pinned below), and the empty string the other three legs get is a value
    # the action ignores, so they keep the overlay analysis their `none` build
    # allows. The variable is read from the action's source, not its README;
    # an action that stopped reading it would bring the warning back, the loud
    # direction. The custom repository property `github-codeql-disable-overlay`
    # does the same from the organisation's settings, outside this file, and
    # for every language at once.
    env:
      CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.build-mode == 'manual' && 'none' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Before `init`, so nothing in this step is traced: the seed is the 52 MB
      # this file exists to keep out of the database. clang is named rather than
      # assumed, for `ci.yml`'s reason.
      - name: Build the compiler from the seed, untraced
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang -I runtime seed/heroes.c runtime/runtime.c -o heroes
          ./heroes --version

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The checkout has no `build/`, so the build compiles the runtime: that
      # compile, with the compiler's words, is what CodeQL reads. A run that
      # traced no compile fails when the database is finalised, *CodeQL
      # detected code written in C/C++ but could not process any of it*, exit
      # 32 (measured 2026-10-12 with a traced command that compiled nothing),
      # which is the loud direction.
      - name: Compile the runtime as the compiler does, traced
        if: matrix.build-mode == 'manual'
        run: ./heroes build examples/gallery/00-first.hero -o "$RUNNER_TEMP/first"

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}
